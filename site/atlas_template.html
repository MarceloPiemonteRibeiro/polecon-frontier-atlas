};

function contestedCard(c, i){
  const sides = [["pos",c.pos],["neg",c.neg],["nul",c.nul],["mixed",c.mix]].filter(([,ps])=>ps&&ps.length);
  const key = {pos:"pos",neg:"neg",nul:"null",mixed:"mixed"};
  const dOf = id => (CARD(id).identification||{}).design || "—";
  // What separates the sides: the dimensions on which the two camps differ most.
  const diff = [];
  const cmp = (a,b,f) => { const A=new Set(a.map(f).filter(Boolean)), B=new Set(b.map(f).filter(Boolean));
    return [...A].filter(x=>!B.has(x)); };
  if(c.pos.length && c.neg.length){
    const dp = cmp(c.pos,c.neg,dOf), dn = cmp(c.neg,c.pos,dOf);
    if(dp.length||dn.length) diff.push(`<b>Design.</b> ${dp.length?`only the "raises" side uses ${dp.map(esc).join(", ")}`:""}${dp.length&&dn.length?"; ":""}${dn.length?`only the "lowers" side uses ${dn.map(esc).join(", ")}`:""}`);
    const yp = d3.median(c.pos.map(id=>P[id].y).filter(Boolean)), yn = d3.median(c.neg.map(id=>P[id].y).filter(Boolean));
    if(yp && yn && Math.abs(yp-yn) >= 6) diff.push(`<b>Period.</b> the "${yp>yn?"raises":"lowers"}" side is the more recent work (median ${Math.max(yp,yn)} against ${Math.min(yp,yn)})`);
    const cp = cmp(c.pos,c.neg,id=>(CARD(id).setting.countries||[])[0]), cn = cmp(c.neg,c.pos,id=>(CARD(id).setting.countries||[])[0]);
    if(cp.length && cn.length) diff.push(`<b>Setting.</b> ${cp.slice(0,3).map(esc).join(", ")} against ${cn.slice(0,3).map(esc).join(", ")}`);
  }
  const row = id => { const k=CARD(id), p=P[id];
    return `<tr data-pid="${id}"><td class="num">${p.y||""}</td><td>${esc(p.au)}</td><td style="color:var(--ink-2)">${esc(k.outcome_desc||"—")}</td><td>${esc(dOf(id))}</td>
      <td>${esc(setStr(k.setting)||"—")}</td><td class="num">${(k.magnitudes||[]).map(magStr).join(", ")||"—"}</td>
      <td>${esc(k.claim||p.fd||"")}</td>${k.scope?`<td style="color:var(--ink-2)">${esc(k.scope)}</td>`:"<td></td>"}</tr>`; };
  return `<div class="section panel">
    <div class="eyebrow">Contested ${String(i+1).padStart(2,"0")} · ${c.n} papers · ${Math.round(100*(1-(c.ag||0)))}% against the majority</div>
    <h3>${esc(cellQ(c.tr,c.ou))}</h3>
    ${c.why?`<div class="callout" style="margin:0 0 8px"><b>Why they differ.</b> ${esc(c.why)}</div>`:""}
    ${c.label?`<p class="caption" style="margin:0 0 6px">These papers disagree while measuring the same thing — their outcome descriptions share <b>${esc(c.label)}</b>. Papers in this cell that measure something else are not counted against them.</p>`:""}
    <div class="scroll-x" style="margin:6px 0 10px"><div style="display:flex;height:16px;border-radius:3px;overflow:hidden;min-width:220px;max-width:460px">
      ${sides.map(([k,ps])=>`<div title="${ps.length} ${DIRN[key[k]][0]}" style="width:${100*ps.length/c.n}%;background:var(${DIRN[key[k]][1]})"></div>`).join("")}</div></div>
    <p style="font-size:14px;margin:0 0 8px">${sides.map(([k,ps])=>`<span class="chip"><span class="dot" style="background:var(${DIRN[key[k]][1]})"></span>${ps.length} ${DIRN[key[k]][0]}</span>`).join(" ")}
      <button class="linkbtn" data-cell="${c.tr}|${c.ou}">see the full cell →</button></p>
    ${diff.length?`<div class="callout"><b>What separates them.</b><ul style="margin:6px 0 0;padding-left:18px">${diff.map(d=>`<li style="font-size:13.5px">${d}</li>`).join("")}</ul></div>`:""}
    ${sides.map(([k,ps]) => `<h4 style="margin-top:14px"><span class="dot" style="background:var(${DIRN[key[k]][1]});display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px"></span>${ps.length} papers: ${DIRN[key[k]][0]}</h4>
      <div class="scroll-x"><table class="ledger"><thead><tr><th>Year</th><th>Authors</th><th>What was measured</th><th>Design</th><th>Setting</th><th>Size</th><th>What it found</th><th>Scope</th></tr></thead><tbody>${ps.map(row).join("")}</tbody></table></div>`).join("")}
  </div>`;
}

/* ---------- How it evolved ---------- */
/* Three questions a reader choosing a research agenda actually asks: how did this field learn to
   identify things, which of its answers have changed, and which canonical models nobody has tested. */
const ERAS = [[0,1989,"to 1989"],[1990,1999,"1990s"],[2000,2009,"2000s"],[2010,2014,"2010-14"],[2015,2019,"2015-19"],[2020,2099,"2020-"]];
const DESIGN_ORDER = ["RCT","RD","DiD","IV","NatExp","Struct","Panel","Obs","XC","Survey","Lab","Text","Hist","Desc"];

    <p class="caption" style="margin-top:0">Share of each period's empirical papers by identification strategy, from the full-text read. The credibility revolution is visible as a composition change, not a volume change: experiments and discontinuity designs displace cross-sectional regression. A design's share tells you what a referee now expects.</p>

// Empirical cards only: a theory paper has no identification strategy to place in an era.
function evoCards(){
  return Object.entries(EV.cards).map(([id,k]) => ({id:+id, k, p:P[+id]}))
    .filter(x => x.p && x.k.confidence!=="none" && !x.k.doubt && x.p.y
                 && DESIGN_ORDER.includes((x.k.identification||{}).design));
}

/* Shift = share of later-half papers on the modal sign of the earlier half, minus that share in the
   earlier half. Strongly negative means the recent literature has turned against the old answer. */
function evoShift(pids){
  const ps = pids.map(id=>({id, y:P[id]?.y, d:CARD(id)?.direction})).filter(x=>x.y && ["pos","neg","null","mixed"].includes(x.d))
    .sort((a,b)=>a.y-b.y);
  if(ps.length < 6) return null;
  const mid = Math.floor(ps.length/2), early = ps.slice(0,mid), late = ps.slice(mid);
  const share = (arr,w) => arr.length ? arr.filter(x=>x.d===w).length/arr.length : 0;
  const modal = share(early,"pos") >= share(early,"neg") ? "pos" : "neg";
  return {ps, shift: share(late,modal) - share(early,modal), modal, cut: late[0].y};
}

function drawEvoLanes(){

  const svg = d3.select(host).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${M.t+rows.length*rh})`)
    .call(d3.axisBottom(x).ticks(8).tickFormat(d3.format("d")).tickSizeOuter(0));
  svg.append("text").attr("x",W-M.r+8).attr("y",M.t-8).attr("class","lbl").style("font-size","11px").text("shift   papers");
  rows.forEach((r,j) => {
    const y = M.t + j*rh + rh/2;
    const lab = `${TRL(r.c.tr)} → ${OUL(r.c.ou)}`;
    svg.append("text").attr("x",M.l-10).attr("y",y).attr("dy","0.35em").attr("text-anchor","end").attr("class","lbl")
      .style("cursor","pointer").text(lab.length>42?lab.slice(0,41)+"…":lab)
      .on("click",()=>{ KN.sel=r.c.tr+"|"+r.c.ou; KN.minN=1; go("known"); })
      .on("mousemove",ev=>showTip(ev,`<div class="tt">${esc(lab)}</div><div class="ts">click for the full ledger</div>`)).on("mouseleave",hideTip);
    svg.append("line").attr("x1",M.l).attr("x2",W-M.r).attr("y1",y).attr("y2",y).attr("stroke",cssVar("--rule"));
    svg.append("g").selectAll("circle").data(r.s.ps).join("circle")
      .attr("cx",d=>x(d.y)).attr("cy",y).attr("r",4.2)
      .attr("fill",d=>`var(${DIRN[d.d][1]})`).attr("stroke",cssVar("--surface")).attr("stroke-width",1.2)
      .style("cursor","pointer")
      .on("mousemove",(ev,d)=>showTip(ev, paperTip(P[d.id]) + `<div class="ts">${DIRN[d.d][0]} · ${esc((CARD(d.id).outcome_desc||"").slice(0,70))}</div>`))
      .on("mouseleave",hideTip).on("click",(ev,d)=>openPaper(d.id));
    const pct = Math.round(100*r.s.shift);
    svg.append("text").attr("x",W-M.r+8).attr("y",y).attr("dy","0.35em").attr("class","lbl num")
      .style("fill", pct<=-34?cssVar("--crit"):cssVar("--ink-2")).text(`${pct>0?"+":""}${pct}%`);
    svg.append("text").attr("x",W-M.r+56).attr("y",y).attr("dy","0.35em").attr("class","lbl num")
      .style("fill",cssVar("--muted")).text(`n=${r.s.ps.length}`);
  });
}

function drawEvoMech(){
  const host = document.getElementById("evoMech"); if(!host) return; host.innerHTML="";
  const sc = EV.mechScore || {};
  const rows = D.mechs.map(m => {
    const d = sc[m.id] || {};
    const all = ["supports","refines","contradicts","tests_inconclusive"].flatMap(v => (d[v]||[]).map(id=>({id,v})));
    const yrs = all.map(x=>P[x.id]?.y).filter(Boolean).sort((a,b)=>a-b);
    const m0 = (m.modelYears||[]).length ? Math.min(...m.modelYears) : null;
    return {m, n:all.length, sup:(d.supports||[]).length, ref:(d.refines||[]).length,
            con:(d.contradicts||[]).length, inc:(d.tests_inconclusive||[]).length,
            m0, med: yrs.length ? yrs[Math.floor(yrs.length/2)] : null, last: yrs.length?yrs[yrs.length-1]:null};
  }).sort((a,b)=>a.n-b.n);
  const cut = rows.length ? rows[Math.floor(rows.length*0.25)].n : 0;
  rows.forEach(r => { r.thin = r.n <= cut; r.conShare = r.n ? r.con/r.n : 0; });
  const bar = r => { const t=r.sup+r.ref+r.con+r.inc; if(!t) return '<span style="color:var(--muted)">no test</span>';
    const seg=[[r.sup,"--good","support"],[r.ref,"--warn","refine"],[r.con,"--crit","contradict"],[r.inc,"--muted","inconclusive"]];
    return `<span style="display:inline-flex;height:11px;width:112px;border-radius:2px;overflow:hidden;vertical-align:middle">`
      + seg.filter(s=>s[0]).map(s=>`<span title="${s[0]} ${s[2]}" style="width:${100*s[0]/t}%;background:var(${s[1]})"></span>`).join("")+`</span>`; };
  host.innerHTML = `<table class="ledger"><thead><tr><th>Canonical model</th><th>Written</th><th>Papers testing it</th><th>How they came out</th><th>Median test</th><th>Lag</th><th>Latest</th></tr></thead><tbody>
    ${rows.map(r=>`<tr data-mech="${r.m.id}" style="cursor:pointer">
      <td>${esc(r.m.name)}${r.thin?' <span class="tag" title="In the least-tested quarter of the canonical models: a theoretical frame with comparatively little evidence behind it">least tested</span>':""}${r.conShare>=0.2?' <span class="tag" style="border-color:var(--crit);color:var(--crit)" title="A fifth or more of the papers testing this model contradict it: the model itself is in play">model in play</span>':""}</td>
      <td class="num">${r.m0||"—"}</td><td class="num">${r.n||0}</td><td>${bar(r)}</td>
      <td class="num">${r.med||"—"}</td><td class="num">${r.m0&&r.med?(r.med-r.m0)+"y":"—"}</td><td class="num">${r.last||"—"}</td></tr>`).join("")}
  </tbody></table>`;
  host.querySelectorAll("tr[data-mech]").forEach(tr => tr.addEventListener("click", () => { go("mechanisms"); selectMech(tr.dataset.mech); }));
}

/* One ranked list across the four kinds of opening, so a reader choosing a project sees them together
   rather than having to weigh four separate tables. Scores are ordinal and deliberately simple: the
   point is a defensible reading order, not a pretense of measurement. */
function drawAgendaBoard(){
  const host = document.getElementById("agendaBoard"); if(!host) return;
  const items = [];
  (EV.contested||[]).forEach(c => {
    const sides = [c.pos.length, c.neg.length, c.nul.length].filter(Boolean).length;
    items.push({score: 60 + c.n + (c.why?6:0), kind:"Live disagreement", tone:"--crit",
      title: cellQ(c.tr,c.ou),
      body: c.why || `${c.pos.length} find the outcome rises, ${c.neg.length} that it falls${c.nul.length?`, ${c.nul.length} find nothing`:""}${c.label?`, all measuring ${c.label}`:""}.`,
      note: `${c.n} papers on ${sides} sides. The contribution is a design that discriminates between them.`,
      act:["contested", null]});
  });
  (EV.thin||[]).filter(t=>t.promise).forEach(t => {
    items.push({score: 40 + (t.promise||0)*9 + (t.exp - t.n), kind:"Hole", tone:"--accent",
      title: `${TRL(t.tr)} → ${OUL(t.ou)}`,
      body: t.why || `Both sides are well studied; their intersection holds ${t.n} paper${t.n===1?"":"s"} against ${t.exp} expected.`,
      note: `Measurement exists on both halves. Promise ${"★".repeat(t.promise)}`,
      act:["known", t.tr+"|"+t.ou]});
  });
  const sc = EV.mechScore||{};
  const mech = D.mechs.map(m => { const d=sc[m.id]||{}; const n=Object.values(d).reduce((a,b)=>a+b.length,0);
    return {m, n, con:(d.contradicts||[]).length}; }).filter(x=>x.n);
  const cut = mech.length ? mech.map(x=>x.n).sort((a,b)=>a-b)[Math.floor(mech.length*0.25)] : 0;
  mech.forEach(x => {
    const inPlay = x.n && x.con/x.n >= 0.2;
    if(!inPlay && x.n > cut) return;
    items.push({score: (inPlay?66:44) + Math.max(0, 40-x.n)/2, kind: inPlay?"Model in play":"Least-tested model", tone: inPlay?"--crit":"--warn",
      title: x.m.name,
      body: inPlay ? `${x.con} of ${x.n} papers testing this model contradict it, so the theory itself is the open question.`
                   : `Only ${x.n} papers in the atlas test this model, the thinnest quarter of the canon.`,
      note: inPlay ? `Canonical statement: ${x.m.models.slice(0,2).join("; ")}.` : `The theoretical frame is published and cited: ${x.m.models.slice(0,2).join("; ")}.`,
      act:["mechanisms", x.m.id]});
  });
  (EV.gapThemes||[]).forEach(t => {
    const bonus = {"wide-open":16,"needs-new-data":10,"needs-new-design":12,"partly-answered":4}[t.maturity]||0;
    items.push({score: 30 + Math.min(24, t.n) + bonus, kind:"Stated gap", tone:"--f4",
      title: t.title, body: t.text || "", note: `${t.n} papers name this${t.maturity?` · ${t.maturity.replace(/-/g," ")}`:""}${t.why?` · ${t.why}`:""}`,
      act:["tree", null]});
  });
  items.sort((a,b)=>b.score-a.score);
  if(!items.length){ host.innerHTML = '<p class="caption">No openings yet — the gap analysis has not been run.</p>'; return; }
  // Round-robin across the kinds rather than a pure score ranking: the four kinds are different
  // reasons to work on something, and a straight sort lets whichever scores highest crowd the rest
  // out entirely (18 holes once took every slot). Within a kind the order is still by score.
  const byKind = new Map();
  items.forEach(it => { const g = byKind.get(it.kind) || []; g.push(it); byKind.set(it.kind, g); });
  const queues = [...byKind.values()], picked = [];
  while(picked.length < 28 && queues.some(q=>q.length)) queues.forEach(q => { if(q.length && picked.length < 28) picked.push(q.shift()); });
  host.innerHTML = picked.map((it,i) => `<div class="panel" style="margin:0;border-left:3px solid var(${it.tone})">
    <div class="eyebrow">${String(i+1).padStart(2,"0")} · ${esc(it.kind)}</div>
    <div style="font-weight:600;font-size:15px;margin-top:2px">${esc(it.title)}</div>
    ${it.body?`<p style="margin:6px 0;font-size:14px;color:var(--ink-2)">${esc(it.body)}</p>`:""}
    <p style="margin:6px 0 0;font-size:13px">${esc(it.note)}</p>
    ${it.act[0]?`<button class="linkbtn" data-go="${it.act[0]}" data-arg="${it.act[1]||""}">look at the evidence →</button>`:""}
  </div>`).join("");
  host.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const to = b.dataset.go, arg = b.dataset.arg;
    if(to==="known" && arg){ KN.sel = arg; KN.minN = 1; }
    go(to);

  }));
}

/* ---------- the gap network ---------- */
/* Topics and the open questions hanging off them. A theme is filed under one branch but its papers
   often come from several, and those cross-links are the interesting part: a question two parts of
   the literature are both waiting on is a better bet than one only a corner cares about. */
const GAP = {topic:null, sel:null, sim:null};
const MATUR = {"wide-open":["--crit","nobody has attacked it"], "needs-new-design":["--accent","needs a new design"],
               "needs-new-data":["--warn","needs new data"], "partly-answered":["--good","partly answered"]};
const maturOf = t => MATUR[t.maturity] || ["--muted","unclassified"];

/* Which topics a theme reaches. Its own branch is where it was clustered, but the statements were
   grouped branch by branch, so a paper's primary branch can never cross — the reach comes from the
   cross-topic tags the papers already carry (a paper filed under voters & accountability may also be
   tagged in state capacity). Two or more such papers makes the second topic a real connection. */
function themeTopics(t){
  const c = new Map();
  (t.pids||[]).forEach(id => { const p = P[id]; if(!p) return;
    [p.lf].concat(p.l2||[]).forEach(lf => { const b = LF[lf] && LF[lf].br; if(b) c.set(b, (c.get(b)||0)+1); }); });
  const out = new Set([t.branch]);
  c.forEach((n,b) => { if(n >= 2 && BR[b]) out.add(b); });
  return [...out].filter(b => BR[b]);
}

function drawGapNet(){
  const host = document.getElementById("gapNet"); if(!host) return; host.innerHTML = "";
  const all = (EV.gapThemes||[]).map((t,i) => ({...t, _i:i, topics:themeTopics(t)}));
  const themes = GAP.topic ? all.filter(t => t.topics.includes(GAP.topic)) : all;
  const topicIds = GAP.topic ? [...new Set(themes.flatMap(t=>t.topics))] : [...new Set(all.flatMap(t=>t.topics))];
  document.getElementById("gapNetAll").hidden = !GAP.topic;
  document.getElementById("gapNetWhere").textContent = GAP.topic
    ? `${BR[GAP.topic].name} · ${themes.length} gaps, with the other topics they also touch`
    : `${all.length} gaps across ${topicIds.length} parts of the literature · ${all.filter(t=>t.topics.length>1).length} touch more than one`;
  document.getElementById("gapNetLegend").innerHTML =
    Object.entries(MATUR).map(([k,[c,l]]) => `<span class="chip"><span class="dot" style="background:var(${c})"></span>${l}</span>`).join("")
    + `<span class="chip" style="border-style:dotted">circle size = papers naming it</span>`;

  const W = Math.max(680, Math.min(1020, host.clientWidth||1000)), H = GAP.topic ? 520 : 680;
  const nodes = topicIds.map(b => ({id:"t_"+b, kind:"t", br:b, name:BR[b].short||BR[b].name,
                                    n:all.filter(t=>t.topics.includes(b)).length, fam:BR[b].fam}))
    .concat(themes.map(t => ({id:"g_"+t._i, kind:"g", t, name:t.title, n:t.n})));
  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const links = [];
  themes.forEach(t => t.topics.forEach(b => { if(byId["t_"+b]) links.push({source:"g_"+t._i, target:"t_"+b, kind:"gt"}); }));
  // Topic-to-topic lines, one per pair of topics that share at least one gap.
  const pair = new Map();
  themes.forEach(t => { const ts = t.topics.filter(b=>byId["t_"+b]);
    for(let i=0;i<ts.length;i++) for(let j=i+1;j<ts.length;j++){
      const k = [ts[i],ts[j]].sort().join("|"); pair.set(k, (pair.get(k)||0)+1); } });
  pair.forEach((n,k) => { const [a,b] = k.split("|"); links.push({source:"t_"+a, target:"t_"+b, kind:"tt", n}); });

  const rOf = d => d.kind==="t" ? 13 + Math.sqrt(d.n)*3.4 : 4.5 + Math.sqrt(d.n)*1.25;
  const svg = d3.select(host).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  svg.append("defs").append("marker").attr("id","gapArrow").attr("viewBox","0 -4 8 8")
    .attr("refX",7).attr("refY",0).attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
    .append("path").attr("d","M0,-3.2L7,0L0,3.2").attr("fill",cssVar("--rule-2"));
  const g = svg.append("g");
  const lk = g.append("g").selectAll("line").data(links).join("line")
    .attr("stroke", d => d.kind==="tt" ? cssVar("--accent") : cssVar("--rule-2"))
    .attr("stroke-width", d => d.kind==="tt" ? Math.min(3.5, 0.8+d.n*0.5) : 1)
    .attr("stroke-dasharray", d => d.kind==="tt" ? "4,3" : null)
    .attr("opacity", d => d.kind==="tt" ? 0.5 : 0.65)
    .attr("marker-end", d => d.kind==="gt" ? "url(#gapArrow)" : null);
  const nd = g.append("g").selectAll("g").data(nodes).join("g").style("cursor","pointer");
  nd.append("circle").attr("r",rOf)
    .attr("fill", d => d.kind==="t" ? famVar(d.fam) : `var(${maturOf(d.t)[0]})`)
    .attr("fill-opacity", d => d.kind==="t" ? 0.9 : 0.78)
    .attr("stroke", d => d.kind==="t" ? cssVar("--ink") : cssVar("--surface")).attr("stroke-width", d => d.kind==="t"?1.5:1.2);
  nd.filter(d=>d.kind==="t").append("text").attr("class","lbl").attr("text-anchor","middle").attr("dy","0.35em")
    .style("font-weight","600").style("pointer-events","none")
    .text(d => d.name.length>22 ? d.name.slice(0,21)+"…" : d.name);
  nd.on("mousemove", (ev,d) => showTip(ev, d.kind==="t"
      ? `<div class="tt">${esc(BR[d.br].name)}</div><div class="ts">${d.n} gaps touch this topic · click to isolate</div>`
      : `<div class="tt">${esc(d.t.title)}</div><div class="ts">${d.n} papers name it · ${maturOf(d.t)[1]}</div>`
        + `<div class="ts">${d.t.topics.map(b=>esc(BR[b].short||b)).join(" · ")}</div><div class="ts">click for the detail</div>`))
    .on("mouseleave", hideTip)
    .on("click", (ev,d) => { hideTip();
      if(d.kind==="t"){ GAP.topic = GAP.topic===d.br ? null : d.br; drawGapNet(); }
      else { GAP.sel = d.t._i; gapModal(d.t); gapDetail(d.t); }
    });

  if(GAP.sim) GAP.sim.stop();
  GAP.sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.id).distance(d=>d.kind==="tt"?170:70).strength(d=>d.kind==="tt"?0.05:0.6))
    .force("charge", d3.forceManyBody().strength(d=>d.kind==="t"?-620:-70))
    .force("center", d3.forceCenter(W/2, H/2))
    .force("collide", d3.forceCollide().radius(d=>rOf(d)+3.5))
    .on("tick", () => {
      nodes.forEach(d => { const r = rOf(d); d.x = Math.max(r+2, Math.min(W-r-2, d.x)); d.y = Math.max(r+2, Math.min(H-r-2, d.y)); });
      lk.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
        .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      nd.attr("transform", d=>`translate(${d.x},${d.y})`);
    });
  nd.call(d3.drag().on("start",(ev,d)=>{ GAP.sim.alphaTarget(0.2).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
    .on("end",(ev,d)=>{ GAP.sim.alphaTarget(0); d.fx=null; d.fy=null; }));
  const keep = (EV.gapThemes||[])[GAP.sel];
  if(keep && themes.some(t=>t._i===GAP.sel)) gapDetail({...keep, topics:themeTopics(keep), _i:GAP.sel});
  else document.getElementById("gapDetail").innerHTML = `<p class="caption">Click a gap in the map to read it here.</p>`;
}

// Count a property across papers, most common first; used for the design and setting summaries.
function collect(ps, f){
  const c = new Map();
  ps.forEach(p => { const k = f(p); if(k) c.set(k, (c.get(k)||0)+1); });
  return [...c.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
}

const MT = {open:new Set(), sel:null, withX:true};
const MT_X = {group:0, mech:262, verd:620, dec:765, paper:765, paperDec:865};
RENDER.mtree = function(){

    <span class="net-legend">${verdictChip("+")}${verdictChip("~")}${verdictChip("-")}<span class="chip"><span class="dot" style="background:var(--accent);border-radius:2px"></span>Models & theory</span></span></div>
  <div class="panel" id="mtInfo"></div>
  <div class="panel tree" style="margin-top:14px"><div class="scroll-x" id="mtSvg"></div><div class="net-legend" style="margin-top:10px">${FAMS.slice(0,8).map((f,i)=>`<span class="chip"><span class="dot" style="background:${famVar(i)}"></span>${esc(f.name)}</span>`).join("")}</div><p class="caption">Paper dots take the colour of their literature family; branch dots carry the verdict. Branches with more than 24 papers split by decade. Click any node to open or close it, a paper to read it.</p></div>`;

function mtEvidence(m){
  const pool = MT.withX ? PALL : PE;
  const all = pool.filter(p=>(p.me||[]).some(x=>x[0]===m.id)).map(p=>({p, v:p.me.find(x=>x[0]===m.id)[1]}));
  const byY = (a,b)=>(a.y||0)-(b.y||0);
  const models = [...new Set([...(m.modelIds||[]), ...all.filter(e=>isTheory(e.p)).map(e=>e.p.id)])].map(i=>P[i]).filter(p=>p && (MT.withX||!p.x)).sort(byY);
  const ev = all.filter(e=>!isTheory(e.p));
  return {models, "+":ev.filter(e=>e.v==="+").map(e=>e.p).sort(byY), "~":ev.filter(e=>e.v==="~").map(e=>e.p).sort(byY), "-":ev.filter(e=>e.v==="-").map(e=>e.p).sort(byY)};
}
function mtToggleMech(id, forceOpen){
  const open = forceOpen || !MT.open.has(id);
  if(open){ MT.open.add(id); ["M","+","~","-"].forEach(v=>MT.open.add(id+"|"+v)); } else MT.open.delete(id);
  MT.sel = id; mtDraw(); mtInfo();
}
function mtDraw(){
  const host=document.getElementById("mtSvg"); if(!host) return; host.innerHTML="";
  const groups=[...new Set(D.mechs.map(m=>m.group))];
  const pnode = (p,v,dec) => ({type:"paper", id:"p"+p.id, p, v, dec});
  const papersOf = (ps,id,v) => {
    if(ps.length<=24) return ps.map(p=>pnode(p,v,false));
    const by=d3.group(ps, p=>p.y?Math.floor(p.y/10)*10:0);
    return [...by.entries()].sort((a,b)=>a[0]-b[0]).map(([d,qs])=>{ const did=`${id}|${d}`; return {type:"dec", id:did, v, name:d?`${d}s`:"n.d.", n:qs.length, children: MT.open.has(did)? qs.map(p=>pnode(p,v,true)) : null}; });
  };
  const lab = {M:"Models & theory","+":"Supports","~":"Qualifies","-":"Contradicts"};
  const root = {type:"root", children: groups.map(g=>({type:"group", id:"g|"+g, name:g, children: D.mechs.filter(m=>m.group===g).map(m=>{
    const E=mtEvidence(m), n=E["+"].length+E["~"].length+E["-"].length;
    return {type:"mech", id:m.id, name:m.name, n, sup:E["+"].length, children: MT.open.has(m.id) ? ["M","+","~","-"].map(v=>[v, v==="M"?E.models:E[v]]).filter(r=>r[1].length).map(([v,ps])=>{ const id=m.id+"|"+v; return {type:"verd", id, v, name:lab[v], n:ps.length, children: MT.open.has(id)? papersOf(ps,id,v) : null}; }) : null};
  })}))};
  const h=d3.hierarchy(root, d=>d.children);
  const rowH=20, leaves=h.leaves().length, H=Math.max(360, leaves*rowH+30);
  d3.tree().size([H-30,1]).separation((a,b)=>a.parent===b.parent?1:1.25)(h);
  h.each(d=>{ const t=d.data.type; d.y = t==="root"?-30 : t==="paper" ? (d.data.dec?MT_X.paperDec:MT_X.paper) : MT_X[t]; });
  const maxX = d3.max(h.descendants(), d=>d.y) + (h.descendants().some(d=>d.data.type==="paper")?380:300);
  const W=Math.max(host.clientWidth||700, maxX+30);
  const svg=d3.select(host).append("svg").attr("width",W).attr("height",H).attr("role","img").attr("aria-label","Tree of canonical mechanisms with the papers that test them");
  const g=svg.append("g").attr("transform","translate(14,15)");
  const vcol = v => v==="+"?"var(--good)":v==="~"?"var(--warn)":v==="-"?"var(--crit)":"var(--accent)";
  g.selectAll("path").data(h.links().filter(l=>l.source.data.type!=="root")).join("path").attr("class","link").attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x))
    .attr("stroke",l=>l.target.data.v?vcol(l.target.data.v):"var(--rule-2)").attr("stroke-opacity",l=>l.target.data.v?0.45:1);
  const node=g.selectAll("g.node").data(h.descendants().filter(d=>d.data.type!=="root")).join("g").attr("class",d=>"node"+(MT.sel===d.data.id?" sel":"")).attr("transform",d=>`translate(${d.y},${d.x})`)
    .attr("tabindex",0).attr("role","button");
  const rM = d3.scaleSqrt().domain([0, d3.max(D.mechs, m=>PALL.filter(p=>(p.me||[]).some(x=>x[0]===m.id)).length)||1]).range([3.5,11]);
  node.each(function(d){ const s=d3.select(this), t=d.data.type;
    if(t==="group"){ s.append("rect").attr("x",-5).attr("y",-5).attr("width",10).attr("height",10).attr("rx",2).attr("fill","var(--accent)"); s.append("text").attr("x",10).attr("dy","0.35em").style("font-weight",600).style("font-size","12px").text(d.data.name.length>36?d.data.name.slice(0,35)+"…":d.data.name); }
    else if(t==="mech"){ s.append("circle").attr("r",rM(d.data.n)).attr("fill",MT.open.has(d.data.id)?"var(--surface)":"var(--accent)").attr("stroke","var(--accent)").attr("stroke-width",2); s.append("text").attr("x",rM(d.data.n)+6).attr("dy","0.35em").text(d.data.name.length>46?d.data.name.slice(0,45)+"…":d.data.name).append("tspan").attr("class","cnt").attr("dx",6).text(d.data.n); }
    else if(t==="verd"){ const open=MT.open.has(d.data.id); s.append("circle").attr("r",6).attr("fill",open?"var(--surface)":vcol(d.data.v)).attr("stroke",vcol(d.data.v)).attr("stroke-width",2.2); s.append("text").attr("x",11).attr("dy","0.35em").text(d.data.name).append("tspan").attr("class","cnt").attr("dx",6).text(d.data.n); }
    else if(t==="dec"){ const open=MT.open.has(d.data.id); s.append("circle").attr("r",4.5).attr("fill",open?"var(--surface)":vcol(d.data.v)).attr("fill-opacity",open?1:.55).attr("stroke",vcol(d.data.v)).attr("stroke-width",1.6); s.append("text").attr("x",9).attr("dy","0.35em").text(d.data.name).append("tspan").attr("class","cnt").attr("dx",6).text(d.data.n); }
    else { const p=d.data.p; s.append("circle").attr("r",4).attr("fill",p.x?"var(--surface)":famVar(p.f)).attr("stroke",famVar(p.f)).attr("stroke-width",p.x?1.8:1);
      const t2=s.append("text").attr("x",9).attr("dy","0.35em").text(`${p.au} ${p.y||""}`); t2.append("tspan").attr("class","cnt").attr("dx",6).text([p.de,(p.ct||[])[0]].filter(Boolean).join(" · ")+(p.x?" · ref":"")); }
  });
  node.on("click",(ev,d)=>mtClick(d.data)).on("keydown",(ev,d)=>{ if(ev.key==="Enter") mtClick(d.data); })
    .on("mousemove",(ev,d)=>{ if(d.data.type==="paper"){ const p=d.data.p; showTip(ev, paperTip(p)+(p.fd?`<div class="ts" style="margin-top:4px;color:var(--ink-2)">${esc(p.fd)}</div>`:"")+(d.data.v!=="M"?`<div class="ts">${VERD[d.data.v][1]}</div>`:"")); } else if(d.data.type==="mech"){ showTip(ev, `<div class="tt">${esc(d.data.name)}</div><div class="ts">${d.data.n} empirical tests · click to ${MT.open.has(d.data.id)?"close":"open"}</div>`); } })
    .on("mouseleave",hideTip);
}
function mtClick(d){
  if(d.type==="paper") return openPaper(d.p.id);
  if(d.type==="mech") return mtToggleMech(d.id);
  if(d.type==="group"){ const ms=D.mechs.filter(m=>"g|"+m.group===d.id); const anyClosed=ms.some(m=>!MT.open.has(m.id)); ms.forEach(m=>{ if(anyClosed){ MT.open.add(m.id); ["M","+","~","-"].forEach(v=>MT.open.add(m.id+"|"+v)); } else MT.open.delete(m.id); }); return mtDraw(); }
  MT.open.has(d.id)?MT.open.delete(d.id):MT.open.add(d.id); mtDraw();
}

function revPool(){

    if(REV.fr && y<2015) return false;

    if(Ds.size && !Ds.has(p.de)) return false;
    if(REV.set==="any") return true;

function revPaperMd(it){ const p=it.p, bits=[p.de?revDes(p.de):"", (p.ct||[]).join(", ")].filter(Boolean).join(" · "), vs=revVerd(p,it.only);

function revPaperHtml(it){ const p=it.p, vs=revVerd(p,it.only);
  return `<div class="rv-p" data-pid="${p.id}" tabindex="0"><div><b>${esc(p.au)} (${p.y||"n.d."})</b> · ${esc(revTi(p))}${p.v?` <span class="muted">${esc(p.v)}</span>`:""}</div><div class="fd">${p.fd?esc(p.fd):`<i class="muted">Title only: finding not coded.</i>`}</div><div class="tags">${p.de?`<span class="tag">${esc(revDes(p.de))}</span>`:""}${(p.ct||[]).slice(0,3).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}${vs.map(([n,v])=>`${verdictChip(v)}<span class="muted">${esc(n)}</span>`).join(" ")}<span class="tag">${p.x?`ref·${p.x}`:`${p.nc} courses`}</span></div></div>`; }
function revMd(B){ return B.map(b=>{ switch(b.t){
  case "h1": return `# ${b.x}`; case "h2": return `## ${b.x}`; case "h3": return `### ${b.x}`; case "p": return b.x; case "q": return `> **${b.x}**`; case "note": return `**${b.k}.** ${b.x}`;
  case "ul": return (b.x?`**${b.x}**\n\n`:"")+b.items.map(x=>`- ${x}`).join("\n");
  case "ps": return b.items.map(revPaperMd).join("\n");

  case "refs": return b.items.map(p=>`- ${revAuFull(p)} (${p.y||"n.d."}). ${revTi(p)}.${p.v?` *${p.v}*.`:""}${p.doi?` https://doi.org/${p.doi}`:""}`).join("\n"); } }).join("\n\n")+"\n"; }
function revHtml(B){ return B.map(b=>{ switch(b.t){
  case "h1": return `<h2>${esc(b.x)}</h2>`; case "h2": return `<h3 class="rv-h2">${esc(b.x)}</h3>`; case "h3": return `<h4 class="rv-h3">${esc(b.x)}</h4>`; case "p": return `<p>${esc(b.x)}</p>`;
  case "q": return `<div class="callout rv-q">${esc(b.x)}</div>`; case "note": return `<div class="branch-note"><b>${esc(b.k)}.</b> ${esc(b.x)}</div>`;
  case "ul": return (b.x?`<h4 class="rv-h3">${esc(b.x)}</h4>`:"")+`<ul>${b.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  case "ps": return `<div class="list">${b.items.map(revPaperHtml).join("")}</div>`;
  case "tbl": return `<div class="scroll-x"><table class="ledger"><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  case "refs": return `<ol class="rv-refs">${b.items.map(p=>`<li data-pid="${p.id}">${esc(revAuFull(p))} (${p.y||"n.d."}). ${esc(revTi(p))}.${p.v?` <i>${esc(p.v)}</i>.`:""}</li>`).join("")}</ol>`; } }).join(""); }
function revPrompt(){

${r.qs.length?`Questions the review must answer:\n${r.qs.map((q,i)=>`${i+1}. ${q}`).join("\n")}\n\n`:""}Instructions

${r.md}

${pack.map(line).join("\n")}
`;
