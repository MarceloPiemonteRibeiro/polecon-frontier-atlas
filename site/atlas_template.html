<title>PolEcon Frontier Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky section rail + wide reading column; views are tabs inside one long atlas. Survey-plate feel: cool paper, navy ink, data colours carry identity. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eef0f4;
  --ink:#141a26; --ink-2:#465063; --muted:#7a8293; --rule:#e1e4ea; --rule-2:#c9cfd9;
  --accent:#1e3866; --accent-ink:#ffffff; --accent-soft:#e6ebf4; --focus:#2a78d6;
  --f0:#2a78d6; --f1:#eb6834; --f2:#1baf7a; --f3:#eda100; --f4:#e87ba4; --f5:#008300; --f6:#6250d6; --f7:#e34948; --f8:#a3a7ae;
  --good:#0ca30c; --good-ink:#006300; --warn:#c98500; --crit:#d03b3b;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95; --seq7:#0d366b; --seq0:#eef0f4;
  --edge:rgba(20,26,38,.10); --edge-hi:rgba(30,56,102,.55);
  --shadow:0 1px 2px rgba(20,26,38,.06),0 8px 24px rgba(20,26,38,.08);
  --font-display:"Spectral",Georgia,"Times New Roman",serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#151922; --sunk:#1b202a;
  --ink:#eceff4; --ink-2:#c2c8d3; --muted:#8a92a2; --rule:#252b36; --rule-2:#343c49;
  --accent:#a9c1ec; --accent-ink:#0e1117; --accent-soft:#1d2738; --focus:#6da7ec;
  --f0:#3987e5; --f1:#d95926; --f2:#199e70; --f3:#c98500; --f4:#d55181; --f5:#008300; --f6:#9085e9; --f7:#e66767; --f8:#6b7079;
  --good:#0ca30c; --good-ink:#0ca30c; --warn:#fab219; --crit:#e66767;
  --seq1:#1d2a3d; --seq2:#163a66; --seq3:#184f95; --seq4:#256abf; --seq5:#3987e5; --seq6:#6da7ec; --seq7:#b7d3f6; --seq0:#1b202a;
  --edge:rgba(236,239,244,.09); --edge-hi:rgba(169,193,236,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#151922; --sunk:#1b202a;
  --ink:#eceff4; --ink-2:#c2c8d3; --muted:#8a92a2; --rule:#252b36; --rule-2:#343c49;
  --accent:#a9c1ec; --accent-ink:#0e1117; --accent-soft:#1d2738; --focus:#6da7ec;
  --f0:#3987e5; --f1:#d95926; --f2:#199e70; --f3:#c98500; --f4:#d55181; --f5:#008300; --f6:#9085e9; --f7:#e66767; --f8:#6b7079;
  --good:#0ca30c; --good-ink:#0ca30c; --warn:#fab219; --crit:#e66767;
  --seq1:#1d2a3d; --seq2:#163a66; --seq3:#184f95; --seq4:#256abf; --seq5:#3987e5; --seq6:#6da7ec; --seq7:#b7d3f6; --seq0:#1b202a;
  --edge:rgba(236,239,244,.09); --edge-hi:rgba(169,193,236,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--font-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 18px;border-bottom:1px solid var(--rule);background:var(--surface)}
.mast-in{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:end}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,4.2vw,46px);line-height:1.05;margin:6px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.lede{max-width:72ch;color:var(--ink-2);margin:0;font-size:16px}
.meta-line{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2);margin-top:12px}
.meta-line b{color:var(--ink);font-weight:500}
.theme-btn{border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:1320px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;padding:12px 12px 10px;cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .k{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-right:6px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.view{max-width:1320px;margin:0 auto}
.view[hidden]{display:none!important}
h2{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.intro{max-width:76ch;color:var(--ink-2);margin:0 0 20px}
.section{margin-top:40px}
.section:first-child{margin-top:0}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.caption{font-size:13px;color:var(--muted);margin-top:8px;max-width:80ch}
.scroll-x{overflow-x:auto;max-width:100%}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--rule-2);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2);background:var(--surface);white-space:nowrap;cursor:default}
button.chip{cursor:pointer;white-space:normal;text-align:left}
button.chip[aria-pressed="false"]{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.verdict{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.v-sup{color:var(--good-ink);background:color-mix(in srgb,var(--good) 14%,transparent)}
.v-qual{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.v-con{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);background:var(--sunk);border-radius:3px;padding:1px 5px;white-space:nowrap}

/* findings cards */
.findings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.findings{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.findings{grid-template-columns:minmax(0,1fr)}}
.finding{border-top:3px solid var(--accent);background:var(--surface);border-left:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);border-radius:0 0 var(--r) var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.finding .n{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.finding p{margin:0;font-size:14px;color:var(--ink-2)}
.finding .claim{font-family:var(--font-display);font-size:17.5px;line-height:1.3;color:var(--ink);font-weight:600}
.finding ul{margin:0;padding-left:18px;font-size:13px}
.finding li{margin:2px 0}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13px;text-align:left}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:14px 0 0}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1}
.stat .l{font-size:12px;color:var(--muted)}

/* svg chart text */
.chart text{fill:var(--ink-2);font-size:11.5px;font-family:var(--font-body)}
.chart .axis path,.chart .axis line{stroke:var(--rule-2)}
.chart .grid line{stroke:var(--rule)}
.chart .lbl{fill:var(--ink);font-size:12px}
.chart .muted{fill:var(--muted)}

/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--rule-2);border-radius:6px;padding:8px 10px;font-size:12.5px;max-width:320px;box-shadow:var(--shadow);line-height:1.4}
#tip .tt{font-weight:600;margin-bottom:2px}
#tip .ts{color:var(--muted)}

/* tree */
.tree-wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.tree-wrap{grid-template-columns:minmax(0,1fr)}}
.tree svg{display:block}
.tree .node{cursor:pointer}
.tree .node text{fill:var(--ink);font-size:12.5px}
.tree .node .cnt{fill:var(--muted);font-family:var(--font-mono);font-size:10.5px}
.tree .link{fill:none;stroke:var(--rule-2);stroke-width:1.2px}
.tree .node.sel text{font-weight:700}
.list{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:9px 4px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:start}
.prow:hover{background:var(--sunk)}
.prow .yr{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:2px}
.prow .ti{font-size:14px;line-height:1.35}
.prow .au{font-size:12.5px;color:var(--muted)}
.prow .nc{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;padding-top:2px}
.sticky-panel{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));max-height:calc(100vh - 80px);overflow:auto}
.branch-note{border-left:3px solid var(--rule-2);padding:2px 0 2px 12px;margin:10px 0;color:var(--ink-2);font-size:14px}
.branch-note b{color:var(--ink)}

/* mechanisms */
.mech-wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.mech-wrap{grid-template-columns:minmax(0,1fr)}}
.mech-list{display:flex;flex-direction:column;gap:2px}
.mech-item{border:0;background:none;text-align:left;padding:8px 10px;border-radius:5px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;color:var(--ink-2)}
.mech-item:hover{background:var(--sunk);color:var(--ink)}
.mech-item[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.mech-item .c{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.mech-arch{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.model-refs{font-family:var(--font-display);font-style:italic;color:var(--ink-2)}
.pred{margin:6px 0 0;padding-left:18px}
.ledger{width:100%;border-collapse:collapse;font-size:13.5px}
.ledger th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--rule-2);padding:6px 8px}
.ledger td{border-bottom:1px solid var(--rule);padding:7px 8px;vertical-align:top}
.ledger tr{cursor:pointer}
.ledger tr:hover td{background:var(--sunk)}

/* network */
.net-controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.net-box{position:relative;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden}
#netCanvas{display:block;width:100%;height:640px;touch-action:none;cursor:grab}
#autCanvas{display:block;width:100%;height:680px;touch-action:none;cursor:grab}
@media (max-width:620px){#netCanvas,#autCanvas{height:440px}}
.net-legend{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.field input[type=search],.field select,.field input[type=number]{border:1px solid var(--rule-2);background:var(--surface);border-radius:5px;padding:5px 8px;font-size:13.5px;min-width:0}
.field input[type=range]{accent-color:var(--accent)}

/* library */
.lib-controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:12px}
.lib-controls input[type=search]{width:min(380px,62vw)}
.field{max-width:100%;flex-wrap:wrap}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{position:sticky;top:0;background:var(--bg);text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--rule-2);padding:7px 8px;cursor:pointer;white-space:nowrap}
.table td{border-bottom:1px solid var(--rule);padding:7px 8px;vertical-align:top}
.table tbody tr{cursor:pointer}
.table tbody tr:hover td{background:var(--sunk)}
.table .t{min-width:260px}
.more{margin-top:12px}
.btn{border:1px solid var(--rule-2);background:var(--surface);border-radius:5px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* drawer */
#drawer{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--rule-2);box-shadow:var(--shadow);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px}
#drawer h3{font-size:21px;margin-top:4px}
.dclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;line-height:1}
#modal{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal[hidden],[hidden]{display:none!important}
.modal-card{position:relative;background:var(--surface);border:1px solid var(--rule-2);border-radius:8px;box-shadow:var(--shadow);width:min(780px,100%);max-height:min(82vh,860px);overflow:auto;padding:18px 20px 14px}
.modal-card h3{padding-right:40px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13.5px;margin:12px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.abstract{font-size:13.5px;color:var(--ink-2);line-height:1.6;border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}
.finding-box{background:var(--accent-soft);border-radius:5px;padding:10px 12px;font-size:14px;margin:10px 0}

/* heatmap & misc */
.hm text{font-size:11.5px}
.legend-ramp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend-ramp .bar{height:10px;width:160px;border-radius:2px}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:10px 0 18px}
.link-step{flex:1 1 150px;min-width:140px;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.link-step:hover{border-color:var(--accent)}
.link-step[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.link-step .s{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.link-step .h{font-weight:600;font-size:14px}
.link-step .c{font-size:12.5px;color:var(--ink-2)}
.gap{color:var(--crit);font-weight:600}
.callout{border:1px solid var(--rule);border-left:3px solid var(--accent);background:var(--surface);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;color:var(--ink-2);font-size:14.5px;max-width:90ch}
.foot{max-width:1320px;margin:48px auto 0;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
/* review builder */
.rv-step{padding:12px 0;border-bottom:1px solid var(--rule)}
.rv-step:first-child{padding-top:0}
.rv-step:last-child{border-bottom:0;padding-bottom:0}
.rv-br summary{cursor:pointer;padding:4px 0;font-size:14px}
.rv-br summary .muted{color:var(--muted);font-size:12px;margin-left:4px}
#revQs{width:100%;border:1px solid var(--rule-2);background:var(--surface);border-radius:5px;padding:8px 10px;font-size:14px;resize:vertical}
.rv-out p{max-width:82ch;color:var(--ink-2)}
.rv-out .muted{color:var(--muted)}
.rv-out ul{max-width:90ch;color:var(--ink-2);padding-left:20px}
.rv-h2{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule)}
.rv-h3{margin:16px 0 4px}
.rv-p{padding:8px 4px;border-bottom:1px solid var(--rule);cursor:pointer;font-size:14px}
.rv-p:hover{background:var(--sunk)}
.rv-p .fd{color:var(--ink-2);margin:2px 0}
.rv-p .tags{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px}
.rv-q{margin:18px 0 8px;font-weight:600;color:var(--ink)}
.rv-refs{font-size:13px;color:var(--ink-2);padding-left:24px}
.rv-refs li{margin:3px 0;cursor:pointer}
@media print{.mast,.tabs,.foot,#revForm,.rv-actions,#drawer,#modal,#tip,#v-review>h2,#v-review>.intro{display:none!important} html,body{background:#fff!important;color:#000!important} main{padding:0} .rv-out{border:0!important;padding:0!important} .rv-p{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="mast">
  <div class="mast-in">
    <div style="min-width:0">
      <div class="eyebrow">Literature map · built from PhD syllabi and the VoxDevLit review</div>
      <h1>PolEcon Frontier Atlas</h1>
      <p class="lede" id="lede"></p>
      <div class="meta-line" id="metaLine"></div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch colour theme">Theme: system</button>
  </div>
</header>
<nav class="tabs" aria-label="Atlas sections">
  <div class="tabs-in" role="tablist" id="tabs"></div>
</nav>
<main>
  <section class="view" id="v-overview" data-title="Overview"></section>
  <section class="view" id="v-known" data-title="What is known" hidden></section>
  <section class="view" id="v-contested" data-title="What is contested" hidden></section>
  <section class="view" id="v-evo" data-title="How it evolved" hidden></section>
  <section class="view" id="v-gaps" data-title="Gaps" hidden></section>
  <section class="view" id="v-review" data-title="Build a review" hidden></section>
  <section class="view" id="v-tree" data-title="Literature tree" hidden></section>
  <section class="view" id="v-mtree" data-title="Mechanism tree" hidden></section>
  <section class="view" id="v-mechanisms" data-title="Models → evidence" hidden></section>

  <section class="view" id="v-authors" data-title="Who writes it" hidden></section>

</main>
<aside id="drawer" hidden aria-label="Paper details"><button class="dclose" id="dclose" type="button" aria-label="Close details">✕</button><div id="dbody"></div></aside>
<div id="modal" hidden role="dialog" aria-modal="true" aria-label="Papers"><div class="modal-card"><button class="dclose" id="mclose" type="button" aria-label="Close">✕</button><div id="mbody"></div></div></div>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>window.DATA=/*__DATA__*/null;window.WORLD=/*__WORLD__*/null;</script>
<script>
"use strict";
const D = window.DATA, P = D.papers;
const fmt = d3.format(",");
const BR = Object.fromEntries(D.branches.map(b => [b.id, b]));
const LF = Object.fromEntries(D.leaves.map(l => [l.id, l]));
const MECH = Object.fromEntries(D.mechs.map(m => [m.id, m]));
const COURSE = Object.fromEntries(D.courses.map(c => [c.id, c]));
const FAMS = D.fams;
const PE = P.filter(p => p.f < 8 && !p.x);                         // syllabus political-economy papers
const PX = P.filter(p => p.f < 8 && p.x);                          // added from reference lists (p.x = syllabus papers citing it)
const PALL = P.filter(p => p.f < 8);
const isTheory = p => ["Theory","Review","Book"].includes(p.de);       // political-economy papers (excludes methods & adjacent dev)
const VERD = {"+":["v-sup","＋ supports"],"~":["v-qual","∼ qualifies"],"-":["v-con","− contradicts"]};
/* ---------- full-text evidence layer (data/evidence.json, built by 17_evidence.py) ---------- */
const EV = D.ev || null;                                           // null in a build with no cards yet
const CARD = id => (EV && EV.cards[id]) || null;
const TRL = id => (EV && EV.treatLabels[id]) || id;
const OUL = id => (EV && EV.outLabels[id]) || id;
const DIRN = {pos:["raises","--good"], neg:["lowers","--crit"], mixed:["mixed","--warn"], null:["no effect","--muted"],
              unknown:["direction not stated","--muted"], na:["no estimate","--muted"]};
const UNITL = {pct:"%", pp:"pp", sd:"SD", log:"log pts", ratio:"×", level:"units", pctile:"pctile"};
const CREDIBLE_DE = new Set(["RCT","RD","DiD","IV","NatExp","Struct"]);
// Which way a cell leans, and how hard. Nulls count against whichever sign leads.
function lean(d){
  const n = d.pos + d.neg + d.null;
  if(!n) return {dir: d.mixed? "mixed":"null", ag: 0, n};
  const dir = d.pos === d.neg ? "mixed" : (d.pos > d.neg ? "pos" : "neg");
  return {dir, ag: Math.max(d.pos, d.neg)/n, n};
}
const magStr = m => `${m.value>0?"+":""}${m.value}${UNITL[m.unit]||m.unit}`;
const setStr = s => !s ? "" : [(s.countries||[]).slice(0,3).join(", "), s.period?`${s.period[0]}–${s.period[1]}`:""].filter(Boolean).join(" · ");
// "Does X change Y?" only reads as a question when both sides are named things.
const VAGUE = new Set(["other","theory_only"]);
// "Does X change Y?" breaks on plurals ("Does colonial institutions change..."), and the cause labels
// are a mix of singular and plural, so the neutral form is the one that always reads.
const cellQ = (tr,ou) => VAGUE.has(tr)||VAGUE.has(ou)
  ? `${TRL(tr)} → ${OUL(ou)}`
  : `The effect of ${TRL(tr).toLowerCase()} on ${OUL(ou).toLowerCase()}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const famVar = f => `var(--f${f})`;
const famColor = f => cssVar(`--f${f}`);
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){ return null; } }

/* ---------- theme ---------- */
const themeBtn = document.getElementById("themeBtn");
const THEMES = ["system","light","dark"];
function applyTheme(t){ if(t==="system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t); themeBtn.textContent = "Theme: " + t; store("atlas-theme", t); onThemeChange(); }
themeBtn.addEventListener("click", () => { const cur = store("atlas-theme") || "system"; applyTheme(THEMES[(THEMES.indexOf(cur)+1)%3]); });
const themeListeners = [];
function onThemeChange(){ themeListeners.forEach(fn => fn()); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onThemeChange);

/* ---------- tooltip ---------- */
const tip = document.getElementById("tip");
function showTip(ev, html){ tip.innerHTML = html; tip.hidden = false; const pad=14, w=tip.offsetWidth, h=tip.offsetHeight; let x=ev.clientX+pad, y=ev.clientY+pad; if(x+w>innerWidth-8) x=ev.clientX-w-pad; if(y+h>innerHeight-8) y=ev.clientY-h-pad; tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.hidden = true; }
const reachLabel = p => p.x ? `not on a syllabus · cited by ${p.x} syllabus papers` : `taught in ${p.nc} course${p.nc===1?"":"s"}`;
const paperTip = p => `<div class="tt">${esc(p.t)}</div><div class="ts">${esc(p.au)} · ${p.y||"n.d."}${p.v?" · "+esc(p.v):""}</div><div class="ts">${esc(LF[p.lf]?.name||"")} · ${reachLabel(p)}</div>`;

/* ---------- drawer ---------- */
const drawer = document.getElementById("drawer"), dbody = document.getElementById("dbody");
document.getElementById("dclose").addEventListener("click", () => { drawer.hidden = true; });
const modal = document.getElementById("modal"), mbody = document.getElementById("mbody");
document.getElementById("mclose").addEventListener("click", () => { modal.hidden = true; });
modal.addEventListener("click", e => { if(e.target===modal) modal.hidden = true; });
document.addEventListener("keydown", e => { if(e.key!=="Escape") return; if(!drawer.hidden) drawer.hidden = true; else modal.hidden = true; });
// pop-up listing papers; rows = [{p, extra}] (extra: html after the authors line)
function papersModal(eyebrow, title, sub, rows){
  mbody.innerHTML = `<div class="eyebrow">${esc(eyebrow)}</div><h3>${esc(title)}</h3><div class="caption" style="margin:0 0 8px">${sub}</div><div class="list">${rows.map(r=>paperRow(r.p, r.extra||"")).join("")}</div>`;
  wireRows(mbody); modal.hidden = false; modal.querySelector(".modal-card").scrollTop = 0;
}
function chipLeaf(id){ const l = LF[id]; if(!l) return ""; return `<span class="chip"><span class="dot" style="background:${famVar(BR[l.br].fam)}"></span>${esc(l.name)}</span>`; }
function verdictChip(v){ const [c,l]=VERD[v]||VERD["+"]; return `<span class="verdict ${c}">${l}</span>`; }
/* What the full-text read found, for the paper drawer. Empty string when the paper has no card. */
function cardBlock(id){
  const k = CARD(id); if(!k || k.confidence==="none") return "";
  const st = k.setting||{}, idn = k.identification||{};
  const q = !["na","unknown"].includes(k.direction) ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">
      <span class="chip"><span class="dot" style="background:var(${DIRN[k.direction][1]})"></span>${DIRN[k.direction][0]} ${esc(OUL(k.outcome).toLowerCase())}</span>
      <span class="chip">${esc(TRL(k.treatment))}</span>
      ${(k.magnitudes||[]).map(m=>`<span class="chip num"${m.t?"":' style="border-style:dashed" title="This figure is not printed anywhere in the paper\'s text, so it was computed rather than quoted — treat it as indicative"'}>${magStr(m)}${m.t?"":"*"}${m.outcome?` · ${esc(m.outcome)}`:""}</span>`).join("")}</div>` : "";
  const rows = [
    k.claim ? ["What it found", esc(k.claim)] : null,
    idn.variation ? ["Source of variation", esc(idn.variation)] : null,
    idn.threat ? ["The authors' own caveat", esc(idn.threat)] : null,
    st.n_units ? ["Sample", `${fmt(st.n_units)} ${esc(st.unit_desc||(st.level||"units").replace(/_/g," "))}`] : null,
    st.period ? ["Data period", `${st.period[0]}–${st.period[1]}`] : null,
    k.scope ? ["How far it travels", esc(k.scope)] : null,
    k.data_asset ? [k.data_novel?"New data built":"Data", esc(k.data_asset)] : null,
  ].filter(Boolean);
  const list = (t, xs) => xs && xs.length ? `<div style="margin-top:10px"><b style="font-size:13px">${t}</b><ul style="margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)">${xs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  if(k.doubt) return `<div class="callout" style="margin-top:12px;border-left-color:var(--crit)">
    <div class="eyebrow" style="margin-bottom:4px">Source not verified</div>
    <p style="margin:0;font-size:13.5px">The PDF filed under this paper does not clearly contain it (${esc(k.doubt)}), so it was read but is kept out of the evidence matrix, the contested questions and the gap map. What that file actually says: <i>${esc(k.claim||"nothing codeable")}</i></p>
  </div>`;
  return `<div class="callout" style="margin-top:12px">
    <div class="eyebrow" style="margin-bottom:4px">Read from the PDF${k.confidence!=="high"?` · ${k.confidence} confidence`:""}</div>
    ${q}
    <dl class="kv" style="margin:0">${rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>
    ${list("It treats as settled", k.settled)}
    ${list("It says these are contested", k.contested)}
    ${list("It says these are open", k.gaps)}
  </div>`;
}
function openPaper(id){
  const p = P[id]; if(!p) return;
  const cites = (D.out[id]||[]).map(j=>P[j]).filter(Boolean).sort((a,b)=>b.nc-a.nc);
  const citedBy = (D.inn[id]||[]).map(j=>P[j]).filter(Boolean).sort((a,b)=>b.y-a.y);
  const plist = arr => arr.slice(0,12).map(q=>`<li><button class="linkbtn" data-pid="${q.id}">${esc(q.au)} (${q.y||"n.d."})</button> <span style="color:var(--muted)">${esc(q.t.slice(0,90))}</span></li>`).join("");
  const srcLabel = {fulltext:"Read in full from the PDF", review:"Read in the VoxDevLit review", abstract:"Abstract read", intro:"Introduction read", "abstract-uncoded":"Abstract shown, not yet coded", title: p.x||!D.download.length?"Title only":"Title only — on your download list"}[p.rs] || "";
  const authLine = (p.A||[]).length ? p.A.map(i=>{ const a=D.authors[i], ins=a.i>=0?D.insts[a.i]:null; return `<button class="linkbtn" data-aid="${i}" title="${esc(ins?ins.n:"affiliation unknown")}">${esc(a.n)}</button>${ins?` <span style="color:var(--muted);font-size:12.5px">(${esc(ins.n)})</span>`:""}`; }).join(", ") : esc(p.af||p.au);
  dbody.innerHTML = `
    <div class="eyebrow">${esc(BR[p.br]?.name||"")}${p.x?" · added from reference lists":""}</div>
    <h3>${esc(p.t)}</h3>
    <div style="color:var(--ink-2);font-size:14px">${authLine} · ${p.y||"n.d."}${p.v?` · <i>${esc(p.v)}</i>`:""}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${chipLeaf(p.lf)}${(p.l2||[]).map(chipLeaf).join("")}${p.fr?'<span class="chip">Frontier (2015+)</span>':""}</div>
    ${p.fd?`<div class="finding-box"><b>Finding.</b> ${esc(p.fd)}</div>`:""}
    ${cardBlock(id)}
    <dl class="kv">
      ${p.ct&&p.ct.length?`<dt>Setting</dt><dd>${esc(p.ct.join(", "))}</dd>`:""}
      ${p.de?`<dt>Design</dt><dd>${esc(D.designs[p.de]||p.de)}</dd>`:""}
      ${p.me&&p.me.length?`<dt>Mechanisms</dt><dd style="display:flex;flex-direction:column;gap:4px">${p.me.map(([m,v])=>`<span><button class="linkbtn" data-mech="${m}">${esc(MECH[m]?.name||m)}</button> ${verdictChip(v)}</span>`).join("")}</dd>`:""}
      ${p.vx&&p.vx.length?`<dt>VoxDev finding</dt><dd>${p.vx.map(f=>esc(D.voxFindings[f]?.short||f)).join("; ")}</dd>`:""}
      <dt>Sources</dt><dd>${p.x?`Not on any syllabus — added because ${p.x} syllabus papers cite it`:p.cs.map(c=>esc(COURSE[c]?.label||c)).join("<br>")}</dd>
      ${p.ci!=null?`<dt>Citations</dt><dd class="num">${fmt(p.ci)} (OpenAlex)</dd>`:""}
      <dt>Source</dt><dd>${esc(srcLabel)}</dd>
      ${p.doi?`<dt>DOI</dt><dd><a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">${esc(p.doi)}</a></dd>`:""}
      ${p.u?`<dt>Open copy</dt><dd><a href="${esc(p.u)}" target="_blank" rel="noopener">open-access link</a></dd>`:""}
    </dl>
    ${p.ab?`<div class="abstract"><h4>Abstract</h4>${esc(p.ab)}</div>`:""}
    ${cites.length?`<div class="abstract"><h4>Builds on (in this atlas) · ${cites.length}</h4><ul style="padding-left:18px;margin:0">${plist(cites)}</ul></div>`:""}
    ${citedBy.length?`<div class="abstract"><h4>Built on by (in this atlas) · ${citedBy.length}</h4><ul style="padding-left:18px;margin:0">${plist(citedBy)}</ul></div>`:""}`;
  drawer.hidden = false; drawer.scrollTop = 0;
  dbody.querySelectorAll("[data-pid]").forEach(b => b.addEventListener("click", () => openPaper(+b.dataset.pid)));
  dbody.querySelectorAll("[data-mech]").forEach(b => b.addEventListener("click", () => { drawer.hidden = true; go("mechanisms"); selectMech(b.dataset.mech); }));
  dbody.querySelectorAll("[data-aid]").forEach(b => b.addEventListener("click", () => { drawer.hidden = true; go("authors"); autSelect(+b.dataset.aid, true); }));
}
function paperRow(p, extra=""){ return `<div class="prow" data-pid="${p.id}" tabindex="0"><span class="yr">${p.y||"—"}</span><span><div class="ti">${esc(p.t)}</div><div class="au">${esc(p.au)}${p.v?" · "+esc(p.v):""}${extra}</div></span>${p.x?`<span class="nc" title="Not on a syllabus: cited by ${p.x} syllabus papers">ref·${p.x}</span>`:`<span class="nc" title="Distinct courses teaching it">${p.nc}×</span>`}</div>`; }
function wireRows(root){ root.querySelectorAll("[data-pid]").forEach(r => { r.addEventListener("click", () => openPaper(+r.dataset.pid)); r.addEventListener("keydown", e => { if(e.key==="Enter") openPaper(+r.dataset.pid); }); }); }

/* ---------- tabs / routing ---------- */
const VIEWS = [["overview","Overview"],["known","What is known"],["contested","What is contested"],["evo","How it evolved"],["gaps","Gaps"],["review","Build a review"],["tree","Literature tree"],["mtree","Mechanism tree"],["mechanisms","Models → evidence"],["network","Citation network"],["authors","Who writes it"],["timeline","When & where"],["courses","Courses"],["agenda","Your agenda"],["library","Library"]]
  .filter(v => (v[0]!=="agenda"||D.agenda) && (!["known","contested","evo","gaps"].includes(v[0]) || (D.ev&&D.ev.cells.length)));
const tabs = document.getElementById("tabs");
const rendered = {};
VIEWS.forEach(([id,label],i) => { const b = document.createElement("button"); b.className="tab"; b.role="tab"; b.id="t-"+id; b.innerHTML=`<span class="k">${String(i+1).padStart(2,"0")}</span>${label}`; b.addEventListener("click", () => go(id)); tabs.appendChild(b); });
function go(id){
  VIEWS.forEach(([v]) => { document.getElementById("v-"+v).hidden = v!==id; document.getElementById("t-"+v).setAttribute("aria-selected", v===id); });
  if(!rendered[id]){ rendered[id]=true; RENDER[id](); }
  if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id);
  window.scrollTo({top:0});
}

/* ---------- masthead ---------- */
document.getElementById("lede").textContent = D.meta.lede;
document.getElementById("metaLine").innerHTML = `<span><b>${fmt(PE.length)}</b> political-economy papers on syllabi</span><span><b>${fmt(PX.length)}</b> added from reference lists</span><span><b>${fmt(P.filter(p=>p.f>=8).length)}</b> methods & adjacent</span>${D.authors.length?`<span><b>${fmt(D.authors.length)}</b> authors</span>`:""}<span><b>${D.courses.length}</b> courses</span><span><b>${D.meta.nSyllabi}</b> syllabi & decks</span><span><b>${fmt(D.meta.nEdges)}</b> citation links</span><span>${D.meta.yearMin}–${D.meta.yearMax}</span>`;
document.getElementById("foot").innerHTML = D.meta.foot;

/* ================= VIEWS ================= */
const RENDER = {};

/* ---------- 1 Overview ---------- */
RENDER.overview = function(){
  const v = document.getElementById("v-overview");
  const nRead = PE.filter(p=>p.rs!=="title").length;
  v.innerHTML = `
  <div class="section">
    <h2>Where the frontier is</h2>
    <div class="intro">${D.meta.thesis}</div>
    <div class="stats">
      <div class="stat"><div class="v">${fmt(PE.length)}</div><div class="l">political-economy papers</div></div>
      <div class="stat"><div class="v">${fmt(PE.filter(p=>p.fr).length)}</div><div class="l">published 2015 or later</div></div>
      <div class="stat"><div class="v">${fmt(PE.filter(p=>p.fd).length)}</div><div class="l">read and coded (finding, mechanism, design)</div></div>
      ${EV?`<div class="stat"><div class="v">${fmt(PE.filter(p=>p.rs==="fulltext").length)}</div><div class="l">read in full from the PDF, not just the abstract <button class="linkbtn" id="toKnown">what that shows →</button></div></div>`:""}
      <div class="stat"><div class="v">${fmt(PE.length-nRead)}</div><div class="l">title only — no abstract or open copy${D.download.length?` · <button class="linkbtn" id="toDl">your download list →</button>`:""}</div></div>
    </div>
  </div>
  <div class="section">
    <h3>Six findings that organise the frontier</h3>
    <p class="intro">The VoxDevLit review (Ferraz, Frey, Fujiwara, Mahadevan, Moreira & Sandholtz, 2026) is the leading reference. Each card counts the papers in this atlas coded as evidence for that finding; open one to list them in the Library.</p>
    <div class="findings" id="fcards"></div>
  </div>
  <div class="section grid2">
    <div class="panel"><h3>Where it is published</h3><p class="caption" style="margin-top:0">Share of papers by type of outlet, for all years and by period of publication. Hover a segment for counts; the ranking lists the journals and presses used most.</p>
      <div class="net-controls"><label class="field"><input type="checkbox" id="venX"> Include works added from reference lists</label></div>
      <div class="scroll-x" id="venueBars"></div><div class="net-legend" id="venueLegend" style="margin-top:8px"></div><h4 style="margin-top:16px">Most used outlets</h4><div class="scroll-x" id="venueTop"></div></div>
    <div class="panel"><h3>Attention is moving</h3><p class="caption" style="margin-top:0">Share of each branch among readings published up to 2009 (hollow) versus 2015 onward (filled). Branches are sorted by the change.</p><div class="scroll-x" id="shiftChart"></div></div>
  </div>
  <div class="section panel"><h3>Canon and frontier</h3><p class="caption" style="margin-top:0">Each dot is one syllabus paper, placed by publication year and grouped by how many of the ${D.courses.length} courses assign it. The top rows are the canon every programme teaches; the shaded band on the right is the frontier (2015 on) entering syllabi. Click a family to hide or show it; click a dot to read the paper.</p>
    <div class="net-legend" id="canonLegend" style="margin-bottom:8px"></div><div class="scroll-x" id="canonChart"></div></div>
  <div class="section">
    <h3>Branch by branch</h3>
    <p class="intro">One paragraph per branch on where the action is now. Each links to its part of the tree.</p>
    <div class="grid3" id="branchNotes"></div>
  </div>`;
  if(D.download.length) document.getElementById("toDl").addEventListener("click", () => { go("library"); document.getElementById("dlist").scrollIntoView({behavior:"smooth"}); });
  if(EV) document.getElementById("toKnown").addEventListener("click", () => go("known"));
  const fc = document.getElementById("fcards");
  fc.innerHTML = Object.entries(D.voxFindings).map(([k,f]) => {
    const ps = PE.filter(p => (p.vx||[]).includes(k)).sort((a,b)=>b.y-a.y);
    return `<div class="finding"><div class="n">Finding ${k.slice(1)} · ${ps.length} papers</div><div class="claim">${esc(f.claim)}</div><p>${esc(f.detail)}</p><ul>${ps.slice(0,3).map(p=>`<li><button class="linkbtn" data-pid="${p.id}">${esc(p.au)} ${p.y}</button></li>`).join("")}</ul><button class="linkbtn" data-vx="${k}">List all ${ps.length} →</button></div>`;
  }).join("");
  fc.querySelectorAll("[data-pid]").forEach(b => b.addEventListener("click", () => openPaper(+b.dataset.pid)));
  fc.querySelectorAll("[data-vx]").forEach(b => b.addEventListener("click", () => { LIB.vx = b.dataset.vx; go("library"); renderLibrary(); }));
  const bn = document.getElementById("branchNotes");
  bn.innerHTML = D.branches.filter(b=>b.fam<8).map(b => `<div class="panel"><div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:${famVar(b.fam)}"></span><span class="eyebrow">${esc(b.id)} · ${esc(FAMS[b.fam].name)}</span></div><h3 style="margin-top:6px">${esc(b.name)}</h3><p style="margin:0;font-size:14px;color:var(--ink-2)">${esc(b.narrative)}</p><button class="linkbtn" style="margin-top:8px" data-br="${b.id}">Open in tree →</button></div>`).join("");
  bn.querySelectorAll("[data-br]").forEach(b => b.addEventListener("click", () => { go("tree"); treeOpenBranch(b.dataset.br); }));
  document.getElementById("venX").addEventListener("change", drawVenues);
  drawShift(); drawCanon(); drawVenues();
  themeListeners.push(() => { if(!document.getElementById("v-overview").hidden){ drawShift(); drawCanon(); drawVenues(); } });
};
function drawShift(){
  const host = document.getElementById("shiftChart"); host.innerHTML="";
  const early = PE.filter(p=>p.y && p.y<=2009), late = PE.filter(p=>p.y>=2015);
  const rows = D.branches.filter(b=>b.fam<8).map(b => ({b, e: early.filter(p=>p.br===b.id).length/early.length, l: late.filter(p=>p.br===b.id).length/late.length})).sort((a,b)=>(b.l-b.e)-(a.l-a.e));
  const W = Math.max(480, host.clientWidth||560), rowH=26, M={t:20,r:58,b:30,l:190}, H=M.t+M.b+rows.length*rowH;
  const x = d3.scaleLinear().domain([0, d3.max(rows, r=>Math.max(r.e,r.l))*1.1]).range([M.l, W-M.r]).nice();

let treeState = {open:new Set(), sel:null, link:"shared"};
RENDER.tree = function(){

  <div class="tree-wrap"><div class="panel tree"><div class="net-controls" id="treeLinkCtl" hidden><span class="field">Connect the selected sub-literature by</span><button class="chip" type="button" data-lk="shared">Shared papers</button><button class="chip" type="button" data-lk="cite">Citations</button><span class="caption" id="treeLinkNote" style="margin:0"></span></div><div class="scroll-x" id="treeSvg"></div></div><div class="panel sticky-panel" id="treePanel"></div></div>`;
  v.querySelectorAll("[data-lk]").forEach(b=>b.addEventListener("click",()=>{ treeState.link=b.dataset.lk; treeState.autoLink=false; drawTree(); }));
  D.branches.filter(b=>b.fam<8).slice(0,0).forEach(b=>treeState.open.add(b.id));

function treeOpenBranch(id){ treeState.open.add(id); drawTree(); treePanel({type:"branch",id}); }
function drawTree(){
  const host = document.getElementById("treeSvg"); if(!host) return; host.innerHTML="";
  const root = {name:"Political economy", children: D.branches.filter(b=>b.fam<8).map(b => ({name:b.short, id:b.id, type:"branch", fam:b.fam, n:PE.filter(p=>p.br===b.id).length, children: treeState.open.has(b.id) ? D.leaves.filter(l=>l.br===b.id).map(l=>({name:l.name,id:l.id,type:"leaf",fam:b.fam,n:l.n})) : null}))};
  const h = d3.hierarchy(root, d=>d.children);
  const leavesN = h.leaves().length, rowH = 22, X1 = 34, X2 = 34 + 330;
  const anyOpen = treeState.open.size > 0;
  const W = Math.max(anyOpen ? X2 + 380 : X1 + 360, host.clientWidth||700), H = Math.max(420, leavesN*rowH+40);
  d3.tree().size([H-40, 1]).separation((a,b)=>a.parent===b.parent?1:1.4)(h);
  h.each(d => { d.y = d.depth===0 ? 0 : d.depth===1 ? X1 : X2; });
  const svg = d3.select(host).append("svg").attr("width",W).attr("height",H).attr("role","img").attr("aria-label","Collapsible tree of the literature");
  const g = svg.append("g").attr("transform","translate(20,20)");
  g.selectAll("path").data(h.links()).join("path").attr("class","link").attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
  const r = d3.scaleSqrt().domain([0, d3.max(D.branches,b=>PE.filter(p=>p.br===b.id).length)]).range([3,13]);
  const node = g.selectAll("g.node").data(h.descendants()).join("g").attr("class",d=>"node"+(treeState.sel===d.data.id?" sel":"")).attr("transform",d=>`translate(${d.y},${d.x})`).attr("tabindex",0).attr("role","button")
    .on("click",(ev,d)=>treeClick(d.data)).on("keydown",(ev,d)=>{ if(ev.key==="Enter") treeClick(d.data); });
  node.append("circle").attr("r",d=>d.depth===0?6:r(d.data.n||0)).attr("fill",d=>d.depth===0?"var(--accent)":d.data.type==="leaf"?famVar(d.data.fam):(treeState.open.has(d.data.id)?"var(--surface)":famVar(d.data.fam))).attr("stroke",d=>d.depth===0?"var(--accent)":famVar(d.data.fam)).attr("stroke-width",2);
  node.filter(d=>d.depth>0).append("text").attr("x",d=>r(d.data.n||0)+6).attr("dy","0.35em")
    .text(d=>d.data.name).append("tspan").attr("class","cnt").attr("dx",6).text(d=>d.data.n);
  drawTreeLinks(svg, g, node, W);

// links from the selected sub-literature to the topics it connects to (shared papers or citations); targets inside closed branches attach to the branch
function leafLinks(lid, mode){
  const out = new Map(), add = (k,v) => { if(!out.has(k)) out.set(k,[]); out.get(k).push(v); };
  const ok = x => x!==lid && LF[x] && BR[LF[x].br].fam<8;
  if(mode==="shared") PALL.forEach(p => { const tags=[p.lf,...(p.l2||[])]; if(tags.includes(lid)) tags.filter(ok).forEach(x=>add(x,{p})); });
  else PALL.filter(p=>p.lf===lid).forEach(p => {
    (D.out[p.id]||[]).forEach(j => { const q=P[j]; if(q && q.f<8 && ok(q.lf)) add(q.lf,{p, q}); });
    (D.inn[p.id]||[]).forEach(j => { const q=P[j]; if(q && q.f<8 && ok(q.lf)) add(q.lf,{p:q, q:p}); });
  });
  return out;
}
function drawTreeLinks(svg, g, node, W){
  const ctl = document.getElementById("treeLinkCtl"), note = document.getElementById("treeLinkNote");
  const lid = LF[treeState.sel] && BR[LF[treeState.sel].br].fam<8 ? treeState.sel : null;
  if(ctl) ctl.hidden = !lid;
  if(!lid) return;
  let mode = treeState.link, links = leafLinks(lid, mode);
  if(mode==="shared" && !links.size){ mode="cite"; links=leafLinks(lid, mode); }
  ctl.querySelectorAll("[data-lk]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lk===mode));
  const pos = new Map(); node.each(function(d){ if(d.depth){ const bb=this.getBBox(); pos.set(d.data.id,{x:d.x, right:d.y+bb.x+bb.width, fam:d.data.fam}); } });
  const agg = new Map();
  links.forEach((items, x) => { const t = treeState.open.has(LF[x].br) ? x : LF[x].br; if(!pos.has(t)) return; const a = agg.get(t) || {items:[], leaves:new Set()}; a.items.push(...items); a.leaves.add(x); agg.set(t,a); });
  const uniq = items => mode==="shared" ? [...new Map(items.map(it=>[it.p.id,it])).values()] : items;
  const arr = [...agg.entries()].map(([t,a]) => ({t, items:uniq(a.items), leaves:[...a.leaves]})).map(a=>({...a, n:a.items.length})).sort((a,b)=>b.n-a.n).slice(0,10);
  const unit = mode==="shared" ? "papers tagged in both" : "citation links";
  note.textContent = arr.length ? `${arr.length} connected topic${arr.length===1?"":"s"} · line width = ${unit} · click a line to list them` : "No links for this sub-literature.";
  if(!arr.length) return;
  const src = pos.get(lid), maxN = d3.max(arr,a=>a.n);
  const gl = g.insert("g", ":first-child");
  let maxX = 0;
  arr.forEach(a => {
    const tp = pos.get(a.t), x1 = src.right+6, y1 = src.x, x2 = tp.right+6, y2 = tp.x;
    const cx = Math.max(x1,x2) + 22 + Math.min(130, Math.abs(y2-y1)*0.2);
    maxX = Math.max(maxX, cx);
    const col = famVar(tp.fam), wdt = 1.3 + 4.2*Math.sqrt(a.n/maxN);
    const name = LF[a.t] ? LF[a.t].name : BR[a.t].name;
    const path = gl.append("path").attr("d",`M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`).attr("fill","none").attr("stroke",col).attr("stroke-width",wdt).attr("stroke-opacity",.7).attr("stroke-linecap","round");
    gl.append("circle").attr("cx",x2).attr("cy",y2).attr("r",3).attr("fill",col);
    const hit = gl.append("path").attr("d",path.attr("d")).attr("fill","none").attr("stroke","transparent").attr("stroke-width",Math.max(12,wdt+8)).style("cursor","pointer");
    const mx = 0.125*(x1+x2)+0.75*cx, my = (y1+y2)/2;
    gl.append("text").attr("x",mx+4).attr("y",my).attr("dy","0.35em").attr("class","num").style("font-size","11px").style("fill",col).style("paint-order","stroke").style("stroke","var(--surface)").style("stroke-width",3).text(a.n);
    hit.on("mousemove",ev=>{ path.attr("stroke-opacity",1); showTip(ev,`<div class="tt">${esc(LF[lid].name)} ↔ ${esc(name)}</div><div class="ts">${a.n} ${unit}${LF[a.t]?"":" (branch closed: "+a.leaves.length+" sub-literatures)"}</div>`); })
      .on("mouseleave",()=>{ path.attr("stroke-opacity",.7); hideTip(); })
      .on("click",()=>{ hideTip();
        if(mode==="shared") papersModal(`${LF[lid].name} ↔ ${name}`, "Papers that speak to both", `${a.n} papers tagged in both sub-literatures`, a.items.map(it=>({p:it.p, extra:` · ${[it.p.lf,...(it.p.l2||[])].map(x=>LF[x]?esc(LF[x].name):"").filter(Boolean).join(" · ")}`})).sort((u,v)=>(v.p.y||0)-(u.p.y||0)));
        else { papersModal(`${LF[lid].name} ↔ ${name}`, "Citation links between the two", `${a.n} links: each row is a paper and the work it cites on the other side`, a.items.sort((u,v)=>(v.p.y||0)-(u.p.y||0)).map(it=>({p:it.p, extra:` · cites <button class="linkbtn" data-qid="${it.q.id}">${esc(it.q.au)} ${it.q.y||""}</button>`})));
          mbody.querySelectorAll("[data-qid]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); openPaper(+b.dataset.qid); })); }
      });
  });
  svg.attr("width", Math.max(W, maxX + 60));
}
function treeClick(d){

  else if(d.type==="leaf"){ treeState.sel=d.id; drawTree(); treePanel({type:"leaf",id:d.id}); }
}

    return;
  }
  const l = LF[sel.id], b = BR[l.br];
  const frontier = store("atlas-frontier")==="1";
  let ps = PE.filter(p=>p.lf===l.id || (p.l2||[]).includes(l.id));
  let xs = PX.filter(p=>p.lf===l.id);
  if(frontier){ ps = ps.filter(p=>p.fr); xs = xs.filter(p=>p.fr); }
  ps.sort((a,b)=>(b.lf===l.id)-(a.lf===l.id) || b.nc-a.nc || (b.y||0)-(a.y||0));
  xs.sort((a,b)=>b.x-a.x);
  const mechs = D.mechs.filter(m=>m.branches.includes(l.id));
  el.innerHTML = `<div class="eyebrow">${esc(b.name)}</div><h3>${esc(l.name)}</h3>
    ${l.settled?`<div class="branch-note"><b>Settled.</b> ${esc(l.settled)}<br><b>Open frontier.</b> ${esc(l.open)}</div>`:""}
    ${leafEvidence(ps)}
    ${mechs.length?`<p style="margin:4px 0 8px;font-size:13.5px;color:var(--ink-2)">Canonical mechanisms: ${mechs.map(m=>`<button class="linkbtn" data-mech="${m.id}">${esc(m.name)}</button>`).join(" · ")}</p>`:""}
    <label class="field" style="margin:6px 0 4px"><input type="checkbox" id="frontierOnly" ${frontier?"checked":""}> Frontier only (2015+)</label>

    <div class="list">${ps.map(p=>paperRow(p)).join("")}</div>
    ${xs.length?`<h4 style="margin-top:18px">Not on the syllabi, but built upon · ${xs.length}</h4><div class="caption" style="margin:0 0 6px">Works this sub-literature's syllabus papers cite heavily (ref·N = cited by N syllabus papers), added from OpenAlex reference lists.</div><div class="list">${xs.map(p=>paperRow(p)).join("")}</div>`:""}`;
  wireRows(el);
  el.querySelector("#frontierOnly").addEventListener("change", e => { store("atlas-frontier", e.target.checked?"1":"0"); treePanel(sel); });

}

/* What the full-text read says about one sub-literature: the questions its papers actually answer,
   and the gaps its own authors name. Returns "" when none of its papers has a card. */
function leafEvidence(ps){
  if(!EV) return "";
  const ks = ps.map(p=>({p, k:CARD(p.id)})).filter(x=>x.k && x.k.confidence!=="none");
  if(ks.length < 3) return "";
  const cell = new Map();
  ks.filter(x=>x.k.direction!=="na").forEach(({p,k}) => {
    const key = k.treatment+"|"+k.outcome;
    const e = cell.get(key) || {tr:k.treatment, ou:k.outcome, dir:{pos:0,neg:0,null:0,mixed:0,na:0}, pids:[]};
    e.dir[k.direction]++; e.pids.push(p.id); cell.set(key, e);
  });
  const top = [...cell.values()].sort((a,b)=>b.pids.length-a.pids.length).slice(0,6);
  // A gap named by several papers is the sub-literature's own verdict on what is missing.
  const seen = new Map();
  ks.forEach(({p,k}) => (k.gaps||[]).forEach(g => {
    const key = g.toLowerCase().replace(/[^a-z ]/g,"").split(" ").filter(w=>w.length>4).slice(0,5).join(" ");
    const e = seen.get(key) || {g, n:0}; e.n++; if(g.length < e.g.length) e.g = g; seen.set(key, e);
  }));
  const gaps = [...seen.values()].sort((a,b)=>b.n-a.n || a.g.length-b.g.length).slice(0,5);
  return `<div class="callout" style="margin:8px 0">
    <div class="eyebrow" style="margin-bottom:4px">From the full-text read · ${ks.length} papers</div>
    ${top.length?`<div style="font-size:13.5px"><b>What its papers actually answer.</b>
      <ul style="margin:4px 0 0;padding-left:18px">${top.map(e=>{const L=lean(e.dir);
        return `<li><button class="linkbtn" data-cellk="${e.tr}|${e.ou}">${esc(TRL(e.tr))} → ${esc(OUL(e.ou))}</button>
          <span class="chip"><span class="dot" style="background:var(${DIRN[L.dir][1]})"></span>${DIRN[L.dir][0]}</span>
          <span style="color:var(--muted)">${e.pids.length} papers</span></li>`;}).join("")}</ul></div>`:""}
    ${gaps.length?`<div style="font-size:13.5px;margin-top:8px"><b>What its authors say is missing.</b>
      <ul style="margin:4px 0 0;padding-left:18px;color:var(--ink-2)">${gaps.map(e=>`<li>${esc(e.g)}${e.n>1?` <span style="color:var(--muted)">(${e.n} papers)</span>`:""}</li>`).join("")}</ul></div>`:""}
  </div>`;
}

function drawMechMatrix(){
  const host = document.getElementById("mechMatrix"); if(!host) return; host.innerHTML="";
  const fams = FAMS.slice(0,8), M={l:250,t:90,r:10,b:10}, cw=64, rh=22;

  const cnt = D.mechs.map(m=>fams.map((f,i)=>PALL.filter(p=>p.f===i && !isTheory(p) && (p.me||[]).some(x=>x[0]===m.id)).length));
  const max = d3.max(cnt.flat());
  const seq = ["--seq1","--seq2","--seq3","--seq4","--seq5","--seq6","--seq7"].map(cssVar);
  const col = c => c===0?cssVar("--seq0"):seq[Math.min(6,Math.floor(Math.sqrt(c/max)*6.999))];
  const svg = d3.select(host).append("svg").attr("class","chart hm").attr("width",W).attr("height",H);
  fams.forEach((f,i)=>svg.append("text").attr("transform",`translate(${M.l+i*cw+cw/2},${M.t-8}) rotate(-35)`).attr("class","lbl").text(f.name));
  D.mechs.forEach((m,j)=>{
    svg.append("text").attr("x",M.l-8).attr("y",M.t+j*rh+rh/2).attr("dy","0.35em").attr("text-anchor","end").attr("class","lbl").style("cursor","pointer").text(m.name.length>36?m.name.slice(0,35)+"…":m.name).on("click",()=>{selectMech(m.id); window.scrollTo({top:0,behavior:"smooth"});});
    fams.forEach((f,i)=>{ const c=cnt[j][i];
      svg.append("rect").attr("x",M.l+i*cw+1).attr("y",M.t+j*rh+1).attr("width",cw-2).attr("height",rh-2).attr("rx",2).attr("fill",col(c)).style("cursor",c?"pointer":"default")
        .on("mousemove",ev=>showTip(ev,`<div class="tt">${esc(m.name)}</div><div class="ts">${esc(f.name)}: ${c} papers${c?" · click to list":""}</div>`)).on("mouseleave",hideTip)
        .on("click",()=>{ if(!c) return; hideTip();
          const ps = PALL.filter(p=>p.f===i && !isTheory(p) && (p.me||[]).some(x=>x[0]===m.id)).map(p=>({p, v:p.me.find(x=>x[0]===m.id)[1]})).sort((a,b)=>(b.p.y||0)-(a.p.y||0));
          papersModal(f.name, m.name, `${ps.length} empirical papers in this family testing the mechanism · ${ps.filter(e=>e.v==="+").length} support, ${ps.filter(e=>e.v==="~").length} qualify, ${ps.filter(e=>e.v==="-").length} contradict`,
            ps.map(e=>({p:e.p, extra:` · ${verdictChip(e.v)}${e.p.fd?`<div style="margin-top:3px;color:var(--ink-2)">${esc(e.p.fd)}</div>`:""}`})));
        });
      if(c) svg.append("text").attr("x",M.l+i*cw+cw/2).attr("y",M.t+j*rh+rh/2).attr("dy","0.35em").attr("text-anchor","middle").style("font-size","11px").style("fill", Math.sqrt(c/max)>0.55?"#fff":cssVar("--ink")).style("pointer-events","none").attr("class","num").text(c);
    });
  });
}

const NET = {famOn:new Set([0,1,2,3,4,5,6,7]), showX:true, minNc:1, minYear:1950, q:"", sel:null, nodes:null, sim:null, t:d3.zoomIdentity};
RENDER.network = function(){

  v.innerHTML = `<h2>Who builds on whom</h2><p class="intro">${D.meta.netIntro}</p>

function netBuild(){
  const ids = new Set(); D.edges.forEach(([a,b])=>{ ids.add(a); ids.add(b); });
  const nodes = PALL.filter(p=>ids.has(p.id)).map(p=>({id:p.id, p, r: 2.2+Math.sqrt(p.nc)*1.6+Math.sqrt((D.inn[p.id]||[]).length)*0.6}));
  const idx = new Map(nodes.map((n,i)=>[n.id,i]));
  const links = D.edges.filter(([a,b])=>idx.has(a)&&idx.has(b)).map(([a,b])=>({source:idx.get(a), target:idx.get(b)}));
  NET.nodes = nodes; NET.links = links; NET.idx = idx;
  // seed positions by family on a ring so clusters start apart
  nodes.forEach(n=>{ const a = (n.p.f/8)*2*Math.PI + (Math.random()-.5)*.6; const rr = 260+Math.random()*90; n.x=Math.cos(a)*rr; n.y=Math.sin(a)*rr; });
  NET.sim = d3.forceSimulation(nodes).force("link", d3.forceLink(links).distance(30).strength(0.1)).force("charge", d3.forceManyBody().strength(-30).distanceMax(320))
    .force("collide", d3.forceCollide(d=>d.r+1)).force("x", d3.forceX(d=>Math.cos(d.p.f/8*2*Math.PI)*230).strength(0.06)).force("y", d3.forceY(d=>Math.sin(d.p.f/8*2*Math.PI)*230).strength(0.06)).stop();
  NET.rank = nodes.slice().sort((a,b)=>(D.inn[b.id]||[]).length-(D.inn[a.id]||[]).length);   // label the most built-upon first
  for(let i=0;i<260;i++) NET.sim.tick();
  const cv = document.getElementById("netCanvas");
  const z = d3.zoom().scaleExtent([0.2,8]).on("zoom", ev=>{ NET.t=ev.transform; netDraw(); });
  d3.select(cv).call(z);
  const fit = () => { const w=cv.clientWidth, h=cv.clientHeight; const xs=d3.extent(nodes,n=>n.x), ys=d3.extent(nodes,n=>n.y); const k=0.92*Math.min(w/(xs[1]-xs[0]+40), h/(ys[1]-ys[0]+40)); d3.select(cv).call(z.transform, d3.zoomIdentity.translate(w/2,h/2).scale(k).translate(-(xs[0]+xs[1])/2,-(ys[0]+ys[1])/2)); };
  NET.fit = fit;
  cv.addEventListener("mousemove", ev=>{ const n=netHit(ev); cv.style.cursor=n?"pointer":"grab"; if(n) showTip(ev, paperTip(n.p)+`<div class="ts">cited by ${(D.inn[n.id]||[]).length} · cites ${(D.out[n.id]||[]).length} in atlas</div>`); else hideTip(); });
  cv.addEventListener("mouseleave", hideTip);
  cv.addEventListener("click", ev=>{ const n=netHit(ev); NET.sel = n?n.id:null; netDraw(); if(n) openPaper(n.id); });
  new ResizeObserver(()=>{ netResize(); }).observe(cv);
  netResize(); fit();
}
function netVisible(n){ const p=n.p; return NET.famOn.has(p.f) && (p.x ? NET.showX : p.nc>=NET.minNc) && (p.y||0)>=NET.minYear; }
function netHit(ev){ const cv=document.getElementById("netCanvas"); const r=cv.getBoundingClientRect(); const [x,y]=NET.t.invert([ev.clientX-r.left, ev.clientY-r.top]); let best=null, bd=Infinity; for(const n of NET.nodes){ if(!netVisible(n)) continue; const d=(n.x-x)**2+(n.y-y)**2; const rr=Math.max(n.r+3, 9/NET.t.k)**2; if(d<rr && d<bd){bd=d;best=n;} } return best; }
function netResize(){ const cv=document.getElementById("netCanvas"); const dpr=window.devicePixelRatio||1; cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr; netDraw(); }
function netDraw(){
  const cv=document.getElementById("netCanvas"); if(!cv||!NET.nodes) return; const ctx=cv.getContext("2d"); const dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.translate(NET.t.x,NET.t.y); ctx.scale(NET.t.k,NET.t.k);
  const cols = Array.from({length:9},(_,i)=>famColor(i)); const edge=cssVar("--edge"), edgeHi=cssVar("--edge-hi"), surf=cssVar("--surface"), ink=cssVar("--ink");
  const sel=NET.sel, nb = new Set(); if(sel!=null){ (D.out[sel]||[]).forEach(j=>nb.add(j)); (D.inn[sel]||[]).forEach(j=>nb.add(j)); nb.add(sel); }
  const q=NET.q;
  ctx.lineWidth=0.6/NET.t.k;
  ctx.strokeStyle=edge; ctx.beginPath();
  for(const l of NET.links){ const a=l.source,b=l.target; if(!netVisible(a)||!netVisible(b)) continue; if(sel!=null && (a.id===sel||b.id===sel)) continue; ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); }
  ctx.stroke();
  if(sel!=null){ ctx.strokeStyle=edgeHi; ctx.lineWidth=1.4/NET.t.k; ctx.beginPath(); for(const l of NET.links){ const a=l.source,b=l.target; if(a.id===sel||b.id===sel){ ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);} } ctx.stroke(); }
  for(const n of NET.nodes){ if(!netVisible(n)) continue; const dim = (sel!=null && !nb.has(n.id)) || (q && !(n.p.t.toLowerCase().includes(q)||n.p.au.toLowerCase().includes(q)));
    ctx.globalAlpha = dim?0.16:1; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,2*Math.PI);
    if(n.p.x){ ctx.fillStyle=surf; ctx.fill(); ctx.lineWidth=1.6/NET.t.k; ctx.strokeStyle=cols[n.p.f]; ctx.stroke(); }
    else { ctx.fillStyle=cols[n.p.f]; ctx.fill(); ctx.lineWidth=1/NET.t.k; ctx.strokeStyle=surf; ctx.stroke(); } }
  ctx.globalAlpha=1;
  // labels for the most cited visible nodes and matches
  ctx.fillStyle=ink; ctx.font=`${11/NET.t.k}px ${cssVar("--font-body")||"sans-serif"}`;
  const nTop = Math.max(10, Math.min(140, Math.round(30*NET.t.k*NET.t.k)));
  const lab = q ? NET.rank.filter(n=>netVisible(n) && (n.p.t.toLowerCase().includes(q)||n.p.au.toLowerCase().includes(q))).slice(0,60)
    : sel!=null ? NET.rank.filter(n=>netVisible(n) && nb.has(n.id)).slice(0,40) : NET.rank.filter(netVisible).slice(0,nTop);
  for(const n of lab){ ctx.fillText(`${n.p.au.split(/[ ,&]/)[0]} ${n.p.y||""}`, n.x+n.r+2/NET.t.k, n.y+3/NET.t.k); }
}

const MAP_BINS=[1,3,6,12,25,50,100];

function drawStack(){

  const keys=d3.range(8); const st=d3.stack().keys(keys)(rows);
  const W=Math.max(620,host.clientWidth||800), H=320, M={t:12,r:16,b:30,l:40};
  const x=d3.scaleLinear().domain([y0,y1]).range([M.l,W-M.r]); const y=d3.scaleLinear().domain([0,d3.max(st[st.length-1],d=>d[1])]).nice().range([H-M.b,M.t]);

  svg.append("g").attr("class","grid").selectAll("line").data(y.ticks(5)).join("line").attr("x1",M.l).attr("x2",W-M.r).attr("y1",y).attr("y2",y);

  const area=d3.area().x(d=>x(d.data.b+bin/2)).y0(d=>y(d[0])).y1(d=>y(d[1])).curve(d3.curveMonotoneX);
  svg.append("g").selectAll("path").data(st).join("path").attr("d",area).attr("fill",d=>famVar(d.key)).attr("fill-opacity",.88).attr("stroke","var(--surface)").attr("stroke-width",1);
  const hl=svg.append("line").attr("y1",M.t).attr("y2",H-M.b).attr("stroke","var(--ink-2)").attr("stroke-width",1).style("display","none");
  svg.append("rect").attr("x",M.l).attr("y",M.t).attr("width",W-M.l-M.r).attr("height",H-M.t-M.b).attr("fill","transparent")
    .on("mousemove",ev=>{ const xv=x.invert(d3.pointer(ev)[0]); const r=rows.find(o=>xv>=o.b&&xv<o.b+bin)||rows[rows.length-1]; hl.style("display",null).attr("x1",x(r.b+bin/2)).attr("x2",x(r.b+bin/2));

  document.getElementById("stackLegend").innerHTML = FAMS.slice(0,8).map((f,i)=>`<span class="chip"><span class="dot" style="background:${famVar(i)}"></span>${esc(f.name)}</span>`).join("");
}

  document.getElementById("failures").innerHTML=A.failures.map(f=>`<div style="border-top:1px solid var(--rule);padding:10px 0"><div class="eyebrow">${esc(f.code)}</div><div style="font-weight:600">${esc(f.name)}</div><p style="margin:4px 0;font-size:14px;color:var(--ink-2)">${esc(f.text)}</p><div style="font-size:13px">${f.papers.map(id=>P[id]).filter(Boolean).map(p=>`<button class="linkbtn" data-pid="${p.id}">${esc(p.au)} ${p.y}</button>`).join(" · ")}</div><p style="margin:6px 0 0;font-size:13px"><b>Open question.</b> ${esc(f.open)}</p></div>`).join("");
  document.getElementById("failures").querySelectorAll("[data-pid]").forEach(b=>b.addEventListener("click",()=>openPaper(+b.dataset.pid)));
  agendaLink(agendaSel ?? 0);
};
function agendaPapers(l){ return PALL.filter(p=> l.leaves.includes(p.lf) || (p.me||[]).some(m=>l.mechs.includes(m[0]))).sort((a,b)=>(b.fr-a.fr)||b.nc-a.nc||(b.y||0)-(a.y||0)); }
function agendaLink(i){
  agendaSel=i; const l=D.agenda.links[i]; document.querySelectorAll(".link-step").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.i===i));
  const ps=agendaPapers(l); const el=document.getElementById("chainBody");
  el.innerHTML=`<div class="eyebrow">Link ${i+1}</div><h3>${esc(l.name)}</h3><p style="color:var(--ink-2);margin:0 0 8px">${esc(l.text)}</p><p style="font-size:13.5px;margin:0 0 10px"><b>Where to look.</b> ${l.leaves.map(id=>chipLeaf(id)).join(" ")}</p>${leafEvidence(ps)}<div class="list">${ps.slice(0,40).map(p=>paperRow(p)).join("")}</div>${ps.length>40?`<p class="caption">${ps.length-40} more in the tree under the sub-literatures above.</p>`:""}`;
  wireRows(el);
  el.querySelectorAll("[data-cellk]").forEach(bt=>bt.addEventListener("click",()=>{ KN.sel=bt.dataset.cellk; KN.minN=1; go("known"); }));
}

/* ================= full-text evidence views ================= */
/* One card per paper read from its PDF (schema in scripts/reader_spec.md); a "cell" is one
   treatment x outcome pair, i.e. one causal question the literature has attacked. */
const KN = {minN:3, fr:false, cred:false, sel:null, zoom:null};
const TGROUPS = () => (EV && EV.treatGroups) || [];
const OGROUPS = () => (EV && EV.outGroups) || [];
const groupOf = (groups, code) => (groups.find(g => g[1].includes(code)) || [null])[0];

function cellsNow(){
  if(!EV) return [];
  return EV.cells.map(c => {
    if(!KN.fr && !KN.cred) return c;
    const pids = c.pids.filter(id => (!KN.fr || P[id].fr) && (!KN.cred || CREDIBLE_DE.has((CARD(id)?.identification||{}).design)));
    if(pids.length === c.n) return c;
    const dir = {pos:0,neg:0,null:0,mixed:0,na:0};
    pids.forEach(id => dir[CARD(id).direction]++);
    const ct = new Set(); pids.forEach(id => (CARD(id).setting.countries||[]).forEach(x=>ct.add(x)));
    return Object.assign({}, c, {pids, n:pids.length, dir, nCt:ct.size, ct:[...ct].slice(0,12),
                                 fr:pids.filter(id=>P[id].fr).length});
  }).filter(c => c.n >= KN.minN);
}

/* Ribbon map of the same cells. Two levels: families of causes against families of outcomes, and
   then, inside one chosen pair of families, the individual causes and outcomes. Drawn by hand rather
   than with a sankey library, because the layout is two fixed columns and needs no solver. */
function drawKnownMap(cells){
  const host = document.getElementById("knMap"); if(!host) return; host.innerHTML = "";
  const back = document.getElementById("mapBack"), where = document.getElementById("mapWhere");
  const z = KN.zoom;
  back.hidden = !z;
  // At the top level a node is a family; inside a zoom it is a single cause or outcome.
  const tg = TGROUPS(), og = OGROUPS();
  const keyL = z ? (c => c.tr) : (c => groupOf(tg, c.tr));
  const keyR = z ? (c => c.ou) : (c => groupOf(og, c.ou));
  const shown = z ? cells.filter(c => groupOf(tg,c.tr)===z[0] && groupOf(og,c.ou)===z[1]) : cells;
  where.textContent = z ? `${z[0]} → ${z[1]} · ${shown.length} question${shown.length===1?"":"s"}`
                        : `${cells.length} questions in ${tg.length} × ${og.length} families`;
  if(!shown.length){ host.innerHTML = '<p class="caption">Nothing here under these filters.</p>'; return; }

  const flows = new Map();
  shown.forEach(c => {
    const k = keyL(c)+"\u0000"+keyR(c);
    const f = flows.get(k) || {l:keyL(c), r:keyR(c), n:0, dir:{pos:0,neg:0,null:0,mixed:0,na:0,unknown:0}, cells:[]};
    f.n += c.n; f.cells.push(c);
    Object.keys(c.dir).forEach(d => { if(f.dir[d]!==undefined) f.dir[d]+=c.dir[d]; });
    flows.set(k, f);
  });
  const fl = [...flows.values()].sort((a,b)=>b.n-a.n);
  const order = (side, codes) => {
    const tot = new Map();
    fl.forEach(f => tot.set(f[side], (tot.get(f[side])||0)+f.n));
    return [...tot.entries()].sort((a,b)=>b[1]-a[1]);
  };
  const L = order("l"), R = order("r");
  const label = z ? (side,k)=> side==="l"?TRL(k):OUL(k) : (side,k)=>k;

  const W = Math.max(700, Math.min(1040, host.clientWidth||1000));
  const M = {l:238, r:238, t:14, b:14}, gap = 9;
  const totL = d3.sum(L,d=>d[1]), totR = d3.sum(R,d=>d[1]);
  const H = Math.max(300, Math.min(720, 26*Math.max(L.length,R.length) + 120));
  const availL = H - M.t - M.b - gap*(L.length-1), availR = H - M.t - M.b - gap*(R.length-1);
  const svg = d3.select(host).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  const pos = {};
  let y = M.t;
  L.forEach(([k,n]) => { const h = Math.max(6, availL*n/totL); pos["l"+k] = {y0:y, h, n, used:0}; y += h + gap; });
  y = M.t;
  R.forEach(([k,n]) => { const h = Math.max(6, availR*n/totR); pos["r"+k] = {y0:y, h, n, used:0}; y += h + gap; });

  const x1 = M.l, x2 = W - M.r, xm = (x1+x2)/2;
  // Thickest flows first so a thin ribbon is never hidden behind a fat one.
  fl.forEach(f => {
    const a = pos["l"+f.l], b = pos["r"+f.r]; if(!a||!b) return;
    const ha = a.h*f.n/a.n, hb = b.h*f.n/b.n;
    const ya = a.y0 + a.used, yb = b.y0 + b.used; a.used += ha; b.used += hb;
    const lean = lean_(f.dir);
    const d = `M${x1},${ya} C${xm},${ya} ${xm},${yb} ${x2},${yb} L${x2},${yb+hb} C${xm},${yb+hb} ${xm},${ya+ha} ${x1},${ya+ha} Z`;
    svg.append("path").attr("d",d).attr("fill",`var(${DIRN[lean.dir][1]})`).attr("opacity",0.3+0.4*lean.ag)
      .style("cursor","pointer")
      .on("mouseover",function(){ d3.select(this).attr("opacity",0.85); })
      .on("mouseout",function(){ d3.select(this).attr("opacity",0.3+0.4*lean.ag); })
      .on("mousemove",ev=>showTip(ev,`<div class="tt">${esc(label("l",f.l))} → ${esc(label("r",f.r))}</div>`
        +`<div class="ts">${f.n} papers in ${f.cells.length} question${f.cells.length===1?"":"s"} · ${f.dir.pos} up, ${f.dir.neg} down, ${f.dir.null} none, ${f.dir.mixed} mixed</div>`
        +`<div class="ts">${z?"click to open the ledger":"click to open this pair"}</div>`))
      .on("mouseleave",hideTip)
      .on("click",()=>{ hideTip();
        if(!z){ KN.zoom = [f.l, f.r]; drawKnown(); }
        else { KN.sel = f.cells[0].tr+"|"+f.cells[0].ou; knBody(f.cells[0]); document.getElementById("knBody").scrollIntoView({behavior:"smooth"}); }
      });
  });
  const node = (side,k,n) => {
    const p = pos[side+k], isL = side==="l";
    svg.append("rect").attr("x",isL?x1-9:x2).attr("y",p.y0).attr("width",9).attr("height",p.h).attr("fill",cssVar("--ink-2"));
    svg.append("text").attr("x",isL?x1-15:x2+15).attr("y",p.y0+p.h/2).attr("dy","0.35em")
      .attr("text-anchor",isL?"end":"start").attr("class","lbl")
      .style("cursor", z?"default":"pointer")
      .text(() => { const t = `${label(side,k)} (${n})`; return t.length>34 ? t.slice(0,33)+"…" : t; })
      .on("mousemove",ev=>showTip(ev,`<div class="tt">${esc(label(side,k))}</div><div class="ts">${n} papers</div>`))
      .on("mouseleave",hideTip);
  };
  L.forEach(([k,n])=>node("l",k,n)); R.forEach(([k,n])=>node("r",k,n));
  svg.append("text").attr("x",x1-9).attr("y",H-2).attr("text-anchor","end").attr("class","lbl").style("fill",cssVar("--muted")).text("what varies");
  svg.append("text").attr("x",x2+9).attr("y",H-2).attr("class","lbl").style("fill",cssVar("--muted")).text("what is measured");
}
// lean() takes a dir object; this variant tolerates the extra keys a summed flow carries.
function lean_(d){ return lean({pos:d.pos||0, neg:d.neg||0, null:d.null||0, mixed:d.mixed||0}); }

function drawKnown(){
  const host = document.getElementById("knMatrix"); if(!host) return; host.innerHTML = "";
  const cells = cellsNow();
  drawKnownMap(cells);
  if(!cells.length){ host.innerHTML = `<p class="caption">No question has that many papers under these filters.</p>`; document.getElementById("knBody").innerHTML=""; return; }
  const tot = (key, id) => cells.filter(c => c[key]===id).reduce((s,c)=>s+c.n, 0);
  const rows = [...new Set(cells.map(c=>c.tr))].sort((a,b)=>tot("tr",b)-tot("tr",a));
  const cols = [...new Set(cells.map(c=>c.ou))].sort((a,b)=>tot("ou",b)-tot("ou",a));
  const at = Object.fromEntries(cells.map(c=>[c.tr+"|"+c.ou, c]));
  const M = {l:218, t:132, r:12, b:12}, cw = 46, rh = 26;
  const W = M.l + cols.length*cw + M.r, H = M.t + rows.length*rh + M.b;
  const maxN = d3.max(cells, c=>c.n);
  const svg = d3.select(host).append("svg").attr("class","chart hm").attr("width",W).attr("height",H);
  cols.forEach((o,i) => svg.append("text").attr("transform",`translate(${M.l+i*cw+cw/2},${M.t-8}) rotate(-42)`).attr("class","lbl").text(OUL(o)));
  rows.forEach((t,j) => {
    svg.append("text").attr("x",M.l-8).attr("y",M.t+j*rh+rh/2).attr("dy","0.35em").attr("text-anchor","end").attr("class","lbl")
      .text(TRL(t).length>32?TRL(t).slice(0,31)+"…":TRL(t));
    cols.forEach((o,i) => {
      const c = at[t+"|"+o];
      const x = M.l+i*cw+1, y = M.t+j*rh+1;
      if(!c){ svg.append("rect").attr("x",x).attr("y",y).attr("width",cw-2).attr("height",rh-2).attr("rx",2).attr("fill",cssVar("--seq0")).attr("opacity",0.35); return; }
      const L = lean(c.dir), split = Math.min(c.dir.pos,c.dir.neg) + (c.dir.null>=2?c.dir.null:0);
      const disagree = c.n>=4 && split>=2 && L.ag<=0.8;
      svg.append("rect").attr("x",x).attr("y",y).attr("width",cw-2).attr("height",rh-2).attr("rx",2)
        .attr("fill",`var(${DIRN[L.dir][1]})`).attr("opacity", 0.3 + 0.7*Math.max(0.25, L.ag) * (0.55+0.45*Math.sqrt(c.n/maxN)))
        .attr("stroke", disagree?cssVar("--ink"):"none").attr("stroke-width",1.5).attr("stroke-dasharray", disagree?"3,2":null)
        .style("cursor","pointer")
        .on("mousemove", ev => showTip(ev, `<div class="tt">${esc(TRL(t))} → ${esc(OUL(o))}</div>`
          + `<div class="ts">${c.n} papers · ${c.dir.pos} raises, ${c.dir.neg} lowers, ${c.dir.null} no effect, ${c.dir.mixed} mixed</div>`
          + `<div class="ts">${c.nCt} ${c.nCt===1?"country":"countries"} · ${c.nCred} credible designs · ${c.fr} since 2015${disagree?" · <b>disagreement</b>":""}</div>`))
        .on("mouseleave", hideTip).on("click", () => { hideTip(); KN.sel = t+"|"+o; knBody(c); });
      svg.append("text").attr("x",x+(cw-2)/2).attr("y",y+(rh-2)/2).attr("dy","0.35em").attr("text-anchor","middle")
        .attr("class","num").style("font-size","11px").style("pointer-events","none")
        .style("fill", L.ag>0.55 && c.n>maxN*0.25 ? "#fff" : cssVar("--ink")).text(c.n);
    });
  });
  const keep = KN.sel && at[KN.sel];
  knBody(keep || cells[0]);
}

function knBody(c){
  const el = document.getElementById("knBody"); if(!el) return;
  KN.sel = c.tr+"|"+c.ou;
  const L = lean(c.dir);
  const byDir = w => c.pids.filter(id => CARD(id).direction===w);
  const bar = [["pos",c.dir.pos],["neg",c.dir.neg],["null",c.dir.null],["mixed",c.dir.mixed]].filter(([,n])=>n);
  const mags = c.pids.flatMap(id => (CARD(id).magnitudes||[]).map(m=>({id,m}))).slice(0,80);
  const row = id => { const k = CARD(id), p = P[id], d=(k.identification||{});
    return `<tr data-pid="${id}"><td class="num">${p.y||""}</td><td>${esc(p.au)}</td>
      <td><span class="chip" style="background:var(${DIRN[k.direction][1]});color:#fff;border:0">${DIRN[k.direction][0]}</span></td>
      <td style="color:var(--ink-2)">${esc(k.outcome_desc||"—")}</td>
      <td>${esc(d.design||"—")}</td><td>${esc(setStr(k.setting)||"—")}</td>
      <td class="num">${(k.magnitudes||[]).map(magStr).join(", ")||"—"}</td>
      <td>${esc(k.claim||p.fd||"")}</td></tr>`; };
  el.innerHTML = `<div class="panel">
    <div class="eyebrow">${esc(TRL(c.tr))} → ${esc(OUL(c.ou))}</div>
    <h3>${esc(cellQ(c.tr,c.ou))}</h3>
    <div class="finding-box"><b>The ledger.</b> ${c.n} papers. ${c.dir.pos} find the outcome goes up, ${c.dir.neg} that it goes down, ${c.dir.null} find no effect, ${c.dir.mixed} report mixed signs.
      ${L.ag>=0.8?`The signs point one way, but read the ledger before calling it settled: a row here is a <i>family</i> of causes and a column a family of measures.`:`The signs divide &mdash; but a reading pass found that most apparent disagreement in this atlas is not disagreement at all, so check <button class="linkbtn" data-goc="1">what is contested</button>, which keeps only the questions that survived it.`}
      Spread over ${c.nCt} ${c.nCt===1?"country":"countries"}${c.nCt<=1?" only, so it has not been shown to travel":""}; ${c.nCred} of ${c.n} use a credible design; ${c.fr} published 2015 or later.</div>
    <div class="scroll-x" style="margin:10px 0"><div style="display:flex;height:16px;border-radius:3px;overflow:hidden;min-width:220px;max-width:460px">
      ${bar.map(([k,n])=>`<div title="${n} ${DIRN[k][0]}" style="width:${100*n/c.n}%;background:var(${DIRN[k][1]})"></div>`).join("")}</div></div>
    ${Object.keys(c.de).length?`<p style="font-size:13.5px;margin:4px 0 0"><b>Designs.</b> ${Object.entries(c.de).map(([d,n])=>`${esc(D.designs[d]||d)} (${n})`).join(" · ")}</p>`:""}
    ${c.ct.length?`<p style="font-size:13.5px;margin:4px 0 0"><b>Settings.</b> ${c.ct.map(esc).join(" · ")}</p>`:""}
    ${mags.length>=3?`<h4 style="margin-top:16px">Reported magnitudes</h4><div class="scroll-x" id="knMags"></div>`:""}
    <h4 style="margin-top:16px">Paper by paper</h4>
    <div class="scroll-x"><table class="ledger"><thead><tr><th>Year</th><th>Authors</th><th>Direction</th><th>What was measured</th><th>Design</th><th>Setting</th><th>Size</th><th>What it found</th></tr></thead>
      <tbody>${c.pids.map(row).join("")}</tbody></table></div>
  </div>`;
  el.querySelectorAll("tr[data-pid]").forEach(r => r.addEventListener("click", () => openPaper(+r.dataset.pid)));
  const gc = el.querySelector("[data-goc]"); if(gc) gc.addEventListener("click", () => go("contested"));
  if(mags.length>=3) drawMagStrip("knMags", mags);
}

/* Dot strip of reported effect sizes, one lane per unit (they are not comparable across units). */
function drawMagStrip(hostId, mags){
  const host = document.getElementById(hostId); if(!host) return; host.innerHTML="";
  const units = [...new Set(mags.map(x=>x.m.unit))];
  const W = Math.max(520, host.clientWidth||600), M={l:62,r:18,t:10,b:22}, lane=34;
  const H = M.t + units.length*lane + M.b;
  const svg = d3.select(host).append("svg").attr("class","chart").attr("width",W).attr("height",H);
  units.forEach((u,i) => {
    const vs = mags.filter(x=>x.m.unit===u);
    const ex = d3.extent(vs, x=>x.m.value), pad = Math.max(1e-6,(ex[1]-ex[0])*0.08) || 1;
    const x = d3.scaleLinear().domain([Math.min(0,ex[0]-pad), Math.max(0,ex[1]+pad)]).range([M.l,W-M.r]);
    const y = M.t + i*lane + lane/2;
    svg.append("text").attr("x",M.l-8).attr("y",y).attr("dy","0.35em").attr("text-anchor","end").attr("class","lbl").text(UNITL[u]||u);
    svg.append("line").attr("x1",M.l).attr("x2",W-M.r).attr("y1",y).attr("y2",y).attr("stroke",cssVar("--rule"));
    if(x.domain()[0]<0 && x.domain()[1]>0) svg.append("line").attr("x1",x(0)).attr("x2",x(0)).attr("y1",y-11).attr("y2",y+11).attr("stroke",cssVar("--ink-2")).attr("stroke-dasharray","2,2");
    svg.append("g").attr("class","axis").attr("transform",`translate(0,${M.t+i*lane+lane-6})`).call(d3.axisBottom(x).ticks(5).tickSizeOuter(0));
    svg.append("g").selectAll("circle").data(vs).join("circle")
      .attr("cx",d=>x(d.m.value)).attr("cy",y).attr("r",4.5)
      .attr("fill",d=>`var(${DIRN[CARD(d.id).direction][1]})`).attr("stroke",cssVar("--surface")).attr("stroke-width",1.3)
      .style("cursor","pointer")
      .on("mousemove",(ev,d)=>showTip(ev, paperTip(P[d.id]) + `<div class="ts"><b>${magStr(d.m)}</b> on ${esc(d.m.outcome||"the outcome")}</div>`))
      .on("mouseleave",hideTip).on("click",(ev,d)=>openPaper(d.id));
  });
}

/* ---------- What is contested ---------- */
RENDER.contested = function(){
  const v = document.getElementById("v-contested");
  const cs = EV.contested;
  v.innerHTML = `
  <div class="section">
    <h2>What is contested</h2>
    <div class="intro">${EV.contestedIntro}${(EV.vetted&&EV.vetted.contestedTotal)?`<p style="margin:10px 0 0;font-size:14px"><b>${EV.vetted.contested} of the ${EV.vetted.contestedTotal}</b> questions below carry a hand-written note on what actually divides their papers${EV.vetted.contested<EV.vetted.contestedTotal?"; the others passed the automatic test but have not yet been read, so treat them more cautiously":""}.</p>`:""}</div>
  </div>
  ${cs.length? cs.map((c,i) => contestedCard(c,i)).join("") : `<div class="section panel"><p class="caption">No question in the atlas yet has enough papers on both sides to count as contested.</p></div>`}`;
  v.querySelectorAll("tr[data-pid],button[data-pid]").forEach(r => r.addEventListener("click", () => openPaper(+r.dataset.pid)));
